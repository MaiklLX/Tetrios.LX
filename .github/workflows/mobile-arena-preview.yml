name: Mobile Arena Visual Preview

on:
  pull_request:
    branches:
      - main
      - design/kt427-block-buddies-brand-identity-2026-11-07
    paths:
      - 'site/**'
      - '.github/workflows/mobile-arena-preview.yml'

permissions:
  contents: read

concurrency:
  group: mobile-arena-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mobile-visual-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR source (no deployment)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare bundled offline soundtrack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/audio site/vendor
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://opengameart.org/sites/default/files/01_holiznacc0_-_chills_0.mp3" \
            --output site/audio/chills.mp3
          test -s site/audio/chills.mp3
          test "$(stat -c%s site/audio/chills.mp3)" -ge 1000000
          # Keep Three.js for campaign-universe visuals, not for the gameplay arena.
          npm pack three@0.180.0 --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/three-package"
          tar -xzf "$RUNNER_TEMP/three-0.180.0.tgz" -C "$RUNNER_TEMP/three-package"
          cp -a "$RUNNER_TEMP/three-package/package" site/vendor/three
          node site/validate-3d-runtime.mjs

      - name: Prepare lightweight 2D arena preview
        shell: bash
        run: |
          set -euo pipefail

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Capture portrait arena previews and verify geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-artifacts
          python3 -m http.server 4173 --directory site > "$RUNNER_TEMP/mobile-preview-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          cat > "$RUNNER_TEMP/mobile-arena-preview.cjs" <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--enable-webgl', '--ignore-gpu-blocklist', '--use-gl=angle', '--use-angle=swiftshader']
            });
            const results = [];
            const failures = [];
            for (const viewport of [
              { name: '375x812', width: 375, height: 812 },
              { name: '412x915', width: 412, height: 915 }
            ]) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                deviceScaleFactor: 1,
                isMobile: true,
                hasTouch: true
              });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.stack || String(error)));
              await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle' });
              await page.locator('button.mode[data-mode="rogue"]').click();
              await page.locator('#bbConfirmStartHero').waitFor({ state: 'visible', timeout: 15000 });
              await page.locator('#bbConfirmStartHero').click();
              await page.locator('#game:not([hidden])').waitFor({ state: 'visible', timeout: 15000 });
              await page.locator('#game .boardframe').waitFor({ state: 'visible' });
              await page.waitForTimeout(900);
              const geometry = await page.evaluate(() => {
                const rect = element => {
                  if (!element) return null;
                  const r = element.getBoundingClientRect();
                  return { x:r.x, y:r.y, width:r.width, height:r.height, right:r.right, bottom:r.bottom };
                };
                const frame = document.querySelector('#game .boardframe');
                const board = document.querySelector('#game #board');
                const side = document.querySelector('#game .sidecol');
                const drop = document.querySelector('#game .side-drop');
                const hold = document.querySelector('#game #holdBtn');
                const left = document.querySelector('#game .gameleftcol');
                const goals = document.querySelector('#game #rogueGoals, #game #campaignGoals');
                const sideChildren = side ? Array.from(side.children).map((element,index) => ({
                  index, id:element.id || '', className:typeof element.className === 'string' ? element.className : '',
                  rect:rect(element), scrollWidth:element.scrollWidth, clientWidth:element.clientWidth,
                  scrollHeight:element.scrollHeight, clientHeight:element.clientHeight,
                  overflowX:getComputedStyle(element).overflowX, overflowY:getComputedStyle(element).overflowY
                })) : [];
                const ratio = frame ? frame.getBoundingClientRect().width / frame.getBoundingClientRect().height : 0;
                return {
                  viewport: { width: innerWidth, height: innerHeight },
                  frame: rect(frame), board: rect(board), side: rect(side), sideChildren, drop: rect(drop), hold: rect(hold), left: rect(left),
                  goals: rect(goals),
                  goalChildren: goals ? Array.from(goals.children).map((element,index) => ({index,tag:element.tagName,rect:rect(element),scrollHeight:element.scrollHeight,clientHeight:element.clientHeight})) : [],
                  leftMetrics: left ? {scrollHeight:left.scrollHeight,clientHeight:left.clientHeight,overflowY:getComputedStyle(left).overflowY} : null,
                  ratio, documentWidth: document.documentElement.scrollWidth,
                  computed: frame ? {
                    width: getComputedStyle(frame).width,
                    height: getComputedStyle(frame).height,
                    aspectRatio: getComputedStyle(frame).aspectRatio,
                    minHeight: getComputedStyle(frame).minHeight,
                    maxHeight: getComputedStyle(frame).maxHeight,
                    flex: getComputedStyle(frame).flex,
                    parent: rect(frame.parentElement),
                    parentHeight: getComputedStyle(frame.parentElement).height,
                    parentAlign: getComputedStyle(frame.parentElement).alignItems
                  } : null
                };
              });
              console.log('ARENA_GEOMETRY_' + viewport.name, JSON.stringify(geometry));
              await page.screenshot({ path: 'preview-artifacts/arena-2d-' + viewport.name + '.png' });
              fs.writeFileSync('preview-artifacts/geometry-' + viewport.name + '.json', JSON.stringify(geometry, null, 2));
              if (geometry.ratio < 0.42 || geometry.ratio > 0.45) {
                failures.push('Arena frame ratio outside expected 10:23 range at ' + viewport.name + ': ' + geometry.ratio);
              }
              if (geometry.documentWidth > viewport.width + 2) {
                failures.push('Unexpected horizontal page overflow at ' + viewport.name + ': ' + geometry.documentWidth);
              }
              if (!geometry.left || !geometry.goals ||
                  geometry.left.y < geometry.frame.bottom + 2 ||
                  geometry.left.x > 20 ||
                  geometry.left.right < viewport.width - 20 ||
                  geometry.goals.y < geometry.left.y ||
                  geometry.goals.bottom > geometry.left.bottom + 2) {
                failures.push('Objective panel must sit below the arena, span the available width, and remain inside its container at ' + viewport.name + ': ' + JSON.stringify({frame:geometry.frame,left:geometry.left,goals:geometry.goals}));
              }
              // Do not reserve an arbitrary 42px footer: this layout has no fixed bottom control bar.
              // The concrete clipping check below verifies the objectives remain inside the viewport.
              if (geometry.side && (
                  geometry.side.x < geometry.frame.right + 2 ||
                  geometry.side.y < geometry.frame.y - 3 ||
                  geometry.side.bottom > geometry.frame.bottom + 3)) {
                failures.push('Right utility rail is not aligned beside the arena at ' + viewport.name + ': ' + JSON.stringify({frame:geometry.frame,side:geometry.side}));
              }
              // KT-427.6: the 375px narrow rail must share the frame's top and
              // bottom edges in both Chromium and WebKit, not merely avoid clipping.
              if (viewport.name === '375x812' && geometry.frame && geometry.side) {
                const topDelta = Math.abs(geometry.side.y - geometry.frame.y);
                const bottomDelta = Math.abs(geometry.side.bottom - geometry.frame.bottom);
                if (topDelta > 2 || bottomDelta > 2) {
                  failures.push('375x812 utility rail must align with the arena frame (top delta ' +
                    topDelta.toFixed(2) + 'px, bottom delta ' + bottomDelta.toFixed(2) + 'px)');
                }
              }
              if (!geometry.drop || geometry.drop.width < 40 || geometry.drop.height < 36 ||
                  geometry.drop.x < geometry.side.x - 1 || geometry.drop.right > geometry.side.right + 1 ||
                  geometry.drop.bottom > viewport.height + 2) {
                failures.push('Hard-drop control is missing, too small, or outside the utility rail at ' + viewport.name + ': ' + JSON.stringify(geometry.drop));
              }
              if (!geometry.hold || geometry.hold.width < 30 || geometry.hold.height < 24 ||
                  geometry.hold.x < geometry.side.x - 1 || geometry.hold.right > geometry.side.right + 1) {
                failures.push('Hold control is missing or too small at ' + viewport.name + ': ' + JSON.stringify(geometry.hold));
              }
              if (!geometry.side || geometry.side.width < 68 || geometry.side.right > viewport.width + 2) {
                failures.push('Mobile utility rail width/position is invalid at ' + viewport.name + ': ' + JSON.stringify(geometry.side));
              }
              for (const child of geometry.sideChildren || []) {
                if (child.rect && (child.rect.left < geometry.side.x - 1 || child.rect.right > geometry.side.right + 1)) {
                  failures.push('Utility card escapes the rail at ' + viewport.name + ': ' + JSON.stringify(child));
                }
                if (child.scrollWidth > child.clientWidth + 2 && child.overflowX !== 'auto') {
                  failures.push('Utility card has horizontal content overflow at ' + viewport.name + ': ' + JSON.stringify(child));
                }
              }
              if (geometry.goals && geometry.goals.bottom > viewport.height - 2) {
                failures.push('Objective panel is clipped by the viewport at ' + viewport.name + ': ' + JSON.stringify({goals:geometry.goals,children:geometry.goalChildren,leftMetrics:geometry.leftMetrics}));
              }
              const arenaModeState = await page.evaluate(() => ({
                toggleCount: document.querySelectorAll('#game .boardframe .bb-arena-toggle').length,
                overlayCanvasCount: document.querySelectorAll('#game .boardframe .bb-arena-canvas').length,
                boardVisible: (() => { const board=document.querySelector('#game #board'); if(!board)return false; const style=getComputedStyle(board),rect=board.getBoundingClientRect(); return style.display!=='none'&&style.visibility!=='hidden'&&Number(style.opacity)>0&&rect.width>0&&rect.height>0; })()
              }));
              if (arenaModeState.toggleCount !== 0 || arenaModeState.overlayCanvasCount !== 0 || !arenaModeState.boardVisible) {
                failures.push('Expected a single-renderer 2D arena at ' + viewport.name + ': ' + JSON.stringify(arenaModeState));
              }
              await page.screenshot({ path: 'preview-artifacts/arena-2d-final-' + viewport.name + '.png' });

              // KT-427.10: prove that the four primary touch actions remain
              // visible/hit-testable in the preview, then exercise their click
              // handlers in this isolated browser context (never user storage).
              const controlState = await page.evaluate(() => {
                const inspect = selector => {
                  const element=document.querySelector(selector);
                  if(!element)return null;
                  const style=getComputedStyle(element),r=element.getBoundingClientRect();
                  const hit=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
                  return {
                    visible:style.display!=='none'&&style.visibility!=='hidden'&&Number(style.opacity)>0&&r.width>0&&r.height>0,
                    enabled:!element.disabled,
                    pointerEvents:style.pointerEvents,
                    hitMatches:!!hit&&(hit===element||element.contains(hit)),
                    rect:{x:Math.round(r.x*100)/100,y:Math.round(r.y*100)/100,width:Math.round(r.width*100)/100,height:Math.round(r.height*100)/100}
                  };
                };
                return {hold:inspect('#holdBtn'),pause:inspect('#pauseBtn'),drop:inspect('#game .side-drop')};
              });
              for (const [name,state] of Object.entries(controlState)) {
                if(!state||!state.visible||!state.enabled||state.pointerEvents==='none'||!state.hitMatches) {
                  failures.push('Primary ' + name + ' control is not interactable at ' + viewport.name + ': ' + JSON.stringify(state));
                }
              }

              await page.locator('#holdBtn').evaluate(element=>element.click());
              await page.locator('#game .side-drop').evaluate(element=>element.click());
              await page.locator('#pauseBtn').evaluate(element=>element.click());
              await page.locator('#overlay.show #resume').waitFor({state:'visible',timeout:8000});
              const resumeState=await page.locator('#overlay.show #resume').evaluate(element=>{
                const style=getComputedStyle(element),r=element.getBoundingClientRect();
                const hit=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
                return {
                  visible:style.display!=='none'&&style.visibility!=='hidden'&&Number(style.opacity)>0&&r.width>0&&r.height>0,
                  enabled:!element.disabled,
                  pointerEvents:style.pointerEvents,
                  hitMatches:!!hit&&(hit===element||element.contains(hit)),
                  rect:{x:Math.round(r.x*100)/100,y:Math.round(r.y*100)/100,width:Math.round(r.width*100)/100,height:Math.round(r.height*100)/100}
                };
              });
              if(!resumeState.visible||!resumeState.enabled||resumeState.pointerEvents==='none'||!resumeState.hitMatches) {
                failures.push('Resume control is not interactable at ' + viewport.name + ': ' + JSON.stringify(resumeState));
              }
              await page.locator('#overlay.show #resume').evaluate(element=>element.click());
              await page.waitForFunction(()=>{
                const overlay=document.querySelector('#overlay');
                return !overlay||!overlay.classList.contains('show');
              },null,{timeout:8000});
              const interactionState=await page.evaluate(()=>({
                gameVisible:!!document.querySelector('#game:not([hidden])'),
                pauseOverlayClosed:!document.querySelector('#overlay')?.classList.contains('show')
              }));
              if(!interactionState.gameVisible||!interactionState.pauseOverlayClosed) {
                failures.push('Pause/Resume did not return to the active arena at ' + viewport.name + ': ' + JSON.stringify(interactionState));
              }
              if(pageErrors.length) failures.push('Primary control interaction produced page errors at ' + viewport.name + ': ' + JSON.stringify(pageErrors));

              results.push({ viewport: viewport.name, geometry, arenaModeState, controlState, resumeState, interactionState, pageErrors });
              await context.close();
            }
            fs.writeFileSync('preview-artifacts/geometry-report.json', JSON.stringify(results, null, 2));
            const browserWarnings = results.flatMap(result => result.pageErrors.map(error => result.viewport + ': ' + error));
            if (browserWarnings.length) console.warn('NON-BLOCKING PAGE ERRORS DURING GAME START:', JSON.stringify(browserWarnings));
            await browser.close();
            console.log(JSON.stringify({ results, failures, browserWarnings }, null, 2));
            if (failures.length) throw new Error(failures.join('\\n'));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node "$RUNNER_TEMP/mobile-arena-preview.cjs"

      - name: Upload mobile preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetrios-mobile-arena-preview
          path: preview-artifacts/
          if-no-files-found: warn
          retention-days: 7
