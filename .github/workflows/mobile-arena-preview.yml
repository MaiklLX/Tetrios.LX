name: Mobile Arena Visual Preview

on:
  pull_request:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/mobile-arena-preview.yml'

permissions:
  contents: read

concurrency:
  group: mobile-arena-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mobile-visual-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR source (no deployment)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare bundled offline soundtrack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/audio
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://opengameart.org/sites/default/files/01_holiznacc0_-_chills_0.mp3" \
            --output site/audio/chills.mp3
          test -s site/audio/chills.mp3
          test "$(stat -c%s site/audio/chills.mp3)" -ge 1000000

      - name: Prepare pinned local Three.js runtime
        shell: bash
        run: |
          set -euo pipefail
          npm pack three@0.180.0 --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/three-package" site/vendor
          tar -xzf "$RUNNER_TEMP/three-0.180.0.tgz" -C "$RUNNER_TEMP/three-package"
          cp -a "$RUNNER_TEMP/three-package/package" site/vendor/three
          node site/validate-3d-runtime.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Capture portrait arena previews and verify geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview-artifacts
          python3 -m http.server 4173 --directory site > "$RUNNER_TEMP/mobile-preview-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then break; fi
            sleep 1
          done
          cat > "$RUNNER_TEMP/mobile-arena-preview.cjs" <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--enable-webgl', '--ignore-gpu-blocklist', '--use-gl=angle', '--use-angle=swiftshader']
            });
            const results = [];
            const failures = [];
            for (const viewport of [
              { name: '375x812', width: 375, height: 812 },
              { name: '412x915', width: 412, height: 915 }
            ]) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                deviceScaleFactor: 1,
                isMobile: true,
                hasTouch: true
              });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(error.stack || String(error)));
              await page.goto('http://127.0.0.1:4173/index.html', { waitUntil: 'networkidle' });
              await page.locator('button.mode[data-mode="rogue"]').click();
              await page.locator('#bbConfirmStartHero').waitFor({ state: 'visible', timeout: 15000 });
              await page.locator('#bbConfirmStartHero').click();
              await page.locator('#game:not([hidden])').waitFor({ state: 'visible', timeout: 15000 });
              await page.locator('#game .boardframe').waitFor({ state: 'visible' });
              await page.waitForTimeout(900);
              const geometry = await page.evaluate(() => {
                const rect = element => {
                  if (!element) return null;
                  const r = element.getBoundingClientRect();
                  return { x:r.x, y:r.y, width:r.width, height:r.height, right:r.right, bottom:r.bottom };
                };
                const frame = document.querySelector('#game .boardframe');
                const board = document.querySelector('#game #board');
                const side = document.querySelector('#game .sidecol');
                const left = document.querySelector('#game .gameleftcol');
                const ratio = frame ? frame.getBoundingClientRect().width / frame.getBoundingClientRect().height : 0;
                return {
                  viewport: { width: innerWidth, height: innerHeight },
                  frame: rect(frame), board: rect(board), side: rect(side), left: rect(left),
                  ratio, documentWidth: document.documentElement.scrollWidth,
                  computed: frame ? {
                    width: getComputedStyle(frame).width,
                    height: getComputedStyle(frame).height,
                    aspectRatio: getComputedStyle(frame).aspectRatio,
                    minHeight: getComputedStyle(frame).minHeight,
                    maxHeight: getComputedStyle(frame).maxHeight,
                    flex: getComputedStyle(frame).flex,
                    parent: rect(frame.parentElement),
                    parentHeight: getComputedStyle(frame.parentElement).height,
                    parentAlign: getComputedStyle(frame.parentElement).alignItems
                  } : null
                };
              });
              console.log('ARENA_GEOMETRY_' + viewport.name, JSON.stringify(geometry));
              await page.screenshot({ path: 'preview-artifacts/arena-2d-' + viewport.name + '.png' });
              fs.writeFileSync('preview-artifacts/geometry-' + viewport.name + '.json', JSON.stringify(geometry, null, 2));
              if (geometry.ratio < 0.42 || geometry.ratio > 0.45) {
                failures.push('Arena frame ratio outside expected 10:23 range at ' + viewport.name + ': ' + geometry.ratio);
              }
              if (geometry.documentWidth > viewport.width + 2) {
                failures.push('Unexpected horizontal page overflow at ' + viewport.name + ': ' + geometry.documentWidth);
              }
              if (geometry.left && geometry.left.y < geometry.frame.bottom + 2) {
                failures.push('Lower objective rail overlaps the arena at ' + viewport.name + ': ' + JSON.stringify({frameBottom:geometry.frame.bottom,railTop:geometry.left.y}));
              }
              if (geometry.left && geometry.left.bottom > viewport.height + 2) {
                failures.push('Lower objective rail extends beyond the viewport at ' + viewport.name + ': ' + geometry.left.bottom);
              }
              const toggle = page.locator('#game .boardframe .bb-arena-toggle');
              await toggle.waitFor({ state: 'visible', timeout: 10000 });
              await toggle.click();
              await page.locator('#game .boardframe.bb-3d-arena-active').waitFor({ state: 'attached', timeout: 15000 });
              await page.waitForTimeout(1200);
              const overlay = await page.evaluate(() => {
                const frame = document.querySelector('#game .boardframe').getBoundingClientRect();
                const board = document.querySelector('#game #board').getBoundingClientRect();
                const canvas = document.querySelector('#game .bb-arena-canvas')?.getBoundingClientRect();
                return canvas ? {
                  frame: {x:frame.x,y:frame.y,width:frame.width,height:frame.height},
                  board: {x:board.x,y:board.y,width:board.width,height:board.height},
                  canvas: {x:canvas.x,y:canvas.y,width:canvas.width,height:canvas.height},
                  delta: Math.max(Math.abs(canvas.x-board.x),Math.abs(canvas.y-board.y),Math.abs(canvas.width-board.width),Math.abs(canvas.height-board.height))
                } : null;
              });
              if (!overlay || overlay.delta > 3) {
                failures.push('3D canvas does not align with 2D board at ' + viewport.name + ': ' + JSON.stringify(overlay));
              }
              await page.screenshot({ path: 'preview-artifacts/arena-3d-' + viewport.name + '.png' });
              results.push({ viewport: viewport.name, geometry, overlay, pageErrors });
              await context.close();
            }
            fs.writeFileSync('preview-artifacts/geometry-report.json', JSON.stringify(results, null, 2));
            const browserWarnings = results.flatMap(result => result.pageErrors.map(error => result.viewport + ': ' + error));
            if (browserWarnings.length) console.warn('NON-BLOCKING PAGE ERRORS DURING GAME START:', JSON.stringify(browserWarnings));
            await browser.close();
            console.log(JSON.stringify({ results, failures, browserWarnings }, null, 2));
            if (failures.length) throw new Error(failures.join('\\n'));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          NODE_PATH="$GITHUB_WORKSPACE/node_modules" node "$RUNNER_TEMP/mobile-arena-preview.cjs"

      - name: Upload mobile preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetrios-mobile-arena-preview
          path: preview-artifacts/
          if-no-files-found: warn
          retention-days: 7
