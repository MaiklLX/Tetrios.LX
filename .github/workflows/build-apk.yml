
name: Build BlockDrop Neon Roguelite APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          test -f BlockDrop_Neon_Roguelite.zip
          mkdir -p BlockDropProject
          unzip -oq BlockDrop_Neon_Roguelite.zip -d BlockDropProject
          test -f BlockDropProject/settings.gradle
          test -f BlockDropProject/app/build.gradle
          test -f BlockDropProject/app/src/main/java/com/maikllx/blockdrop/MainActivity.java

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          cd BlockDropProject
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockDrop-Neon-Roguelite-debug
          path: BlockDropProject/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
