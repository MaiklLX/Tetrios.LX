
name: Build Block Buddies APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Bundle CC0 soundtrack for offline play
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/site/audio"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://opengameart.org/sites/default/files/01_holiznacc0_-_chills_0.mp3" \
            --output "$GITHUB_WORKSPACE/site/audio/chills.mp3"
          test -s "$GITHUB_WORKSPACE/site/audio/chills.mp3"
          AUDIO_SIZE="$(stat -c%s "$GITHUB_WORKSPACE/site/audio/chills.mp3")"
          if [ "$AUDIO_SIZE" -lt 1000000 ]; then
            echo "::error::CC0 soundtrack download is unexpectedly small"
            exit 1
          fi
          echo "Prepared bundled CC0 soundtrack ($AUDIO_SIZE bytes)"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify ZIP archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/Block_Buddies_Android_APK_Project_v1.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP archive not found"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip


      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -oq \
            "$GITHUB_WORKSPACE/Block_Buddies_Android_APK_Project_v1.zip" \
            -d "$GITHUB_WORKSPACE/android-project"

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/android-project" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Gradle settings file not found in ZIP"
            find "$GITHUB_WORKSPACE/android-project" -maxdepth 5 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app module build file not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Prepare local Three.js runtime
        shell: bash
        run: |
          set -euo pipefail
          npm pack three@0.180.0 --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/three-package" "$GITHUB_WORKSPACE/site/vendor"
          tar -xzf "$RUNNER_TEMP/three-0.180.0.tgz" -C "$RUNNER_TEMP/three-package"
          rm -rf "$GITHUB_WORKSPACE/site/vendor/three"
          cp -a "$RUNNER_TEMP/three-package/package" "$GITHUB_WORKSPACE/site/vendor/three"
          test -s "$GITHUB_WORKSPACE/site/vendor/three/build/three.module.js"
          test -s "$GITHUB_WORKSPACE/site/vendor/three/examples/jsm/loaders/GLTFLoader.js"
          echo "Prepared pinned local Three.js 0.180.0 runtime"
          node "$GITHUB_WORKSPACE/site/validate-3d-runtime.mjs"

      - name: Sync latest game and fix Android activity
        shell: bash
        run: |
          set -euo pipefail

          ASSET_INDEX="$(find "$PROJECT_DIR/app/src/main" -type f -path '*/assets/*' -name index.html -print -quit)"

          if [ -z "$ASSET_INDEX" ]; then
            echo "::error::Android assets/index.html not found"
            find "$PROJECT_DIR/app/src/main" -maxdepth 6 -type f | sort
            exit 1
          fi

          cp "$GITHUB_WORKSPACE/site/index.html" "$ASSET_INDEX"
          ASSET_DIR="$(dirname "$ASSET_INDEX")"

          # Keep every local dependency referenced by index.html beside it in
          # Android assets. Copying index.html alone silently disables the 3D
          # modules and the visual theme inside the WebView APK.
          for asset in favicon.svg visual-overhaul.css visual-3d.js arena-3d.js; do
            SOURCE="$GITHUB_WORKSPACE/site/$asset"
            if [ ! -s "$SOURCE" ]; then
              echo "::error::Required web asset is missing: $SOURCE"
              exit 1
            fi
            cp "$SOURCE" "$ASSET_DIR/$asset"
          done

          if [ ! -d "$GITHUB_WORKSPACE/site/characters" ]; then
            echo "::error::Character asset directory is missing"
            exit 1
          fi
          mkdir -p "$ASSET_DIR/characters"
          cp -a "$GITHUB_WORKSPACE/site/characters/." "$ASSET_DIR/characters/"

          for asset in index.html favicon.svg visual-overhaul.css visual-3d.js arena-3d.js; do
            if [ ! -s "$ASSET_DIR/$asset" ]; then
              echo "::error::Android WebView asset was not synced: $asset"
              exit 1
            fi
          done
          echo "Synced game and 3D dependencies into Android assets: $ASSET_DIR"
          if [ ! -d "$GITHUB_WORKSPACE/site/vendor/three" ]; then
            echo "::error::Local Three.js runtime was not prepared"
            exit 1
          fi
          mkdir -p "$ASSET_DIR/vendor"
          rm -rf "$ASSET_DIR/vendor/three"
          cp -a "$GITHUB_WORKSPACE/site/vendor/three" "$ASSET_DIR/vendor/three"
          test -s "$ASSET_DIR/vendor/three/build/three.module.js"
          test -s "$ASSET_DIR/vendor/three/examples/jsm/loaders/GLTFLoader.js"
          echo "Synced local Three.js runtime into Android assets: $ASSET_DIR/vendor/three"

          echo "Synced latest game: $ASSET_INDEX"

          MAIN_ACTIVITY="$(find "$PROJECT_DIR/app/src/main/java" -type f -name MainActivity.java -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.java not found"
            exit 1
          fi

          sed -i 's/protected void onWindowFocusChanged(boolean hasFocus)/public void onWindowFocusChanged(boolean hasFocus)/' "$MAIN_ACTIVITY"
          grep -n 'onWindowFocusChanged' "$MAIN_ACTIVITY"

      - name: Install Android SDK components
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Build APK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if ! command -v gradle >/dev/null 2>&1; then
            echo "::error::Gradle is not installed"
            exit 1
          fi

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Block-Buddies-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare stable APK download
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/Block-Buddies.apk"
          test -s "$GITHUB_WORKSPACE/Block-Buddies.apk"

      - name: Publish latest APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Tetrios.LX — Android APK
          body: |
            Автоматически собранная Android-версия Block Buddies из актуальной версии сайта.
            Файл Block-Buddies.apk можно установить на Android. Это debug-сборка.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: Block-Buddies.apk

      - name: Stage APK for direct website download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/site/download"
          cp "$GITHUB_WORKSPACE/Block-Buddies.apk" "$GITHUB_WORKSPACE/site/download/Block-Buddies.apk"
          test -s "$GITHUB_WORKSPACE/site/download/Block-Buddies.apk"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website and APK to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website and direct APK
        id: pages-deployment
        uses: actions/deploy-pages@v4
