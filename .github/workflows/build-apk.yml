steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Check ZIP archive
    run: |
      ls -la
      test -f Block_Buddies_Android_APK_Project.zip

  - name: Extract project
    run: |
      sudo apt-get update
      sudo apt-get install -y unzip
      mkdir -p android-project
      unzip -oq Block_Buddies_Android_APK_Project.zip -d android-project
      find android-project -maxdepth 5 -type f | head -150

  - name: Find Android project
    run: |
      PROJECT_DIR="$(find "$GITHUB_WORKSPACE/android-project" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: settings.gradle not found inside ZIP"
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Project directory: $PROJECT_DIR"

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Build APK
    run: |
      cd "$PROJECT_DIR"
      if [ ! -f gradlew ]; then
        echo "ERROR: gradlew is missing from the archive"
        exit 1
      fi
      chmod +x gradlew
      ./gradlew --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Block-Buddies-debug-apk
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
