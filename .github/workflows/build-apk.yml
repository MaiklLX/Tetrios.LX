
name: Build Block Buddies APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Bundle CC0 soundtrack for offline play
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/site/audio"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://opengameart.org/sites/default/files/01_holiznacc0_-_chills_0.mp3" \
            --output "$GITHUB_WORKSPACE/site/audio/chills.mp3"
          test -s "$GITHUB_WORKSPACE/site/audio/chills.mp3"
          AUDIO_SIZE="$(stat -c%s "$GITHUB_WORKSPACE/site/audio/chills.mp3")"
          if [ "$AUDIO_SIZE" -lt 1000000 ]; then
            echo "::error::CC0 soundtrack download is unexpectedly small"
            exit 1
          fi
          echo "Prepared bundled CC0 soundtrack ($AUDIO_SIZE bytes)"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify ZIP archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/Block_Buddies_Android_APK_Project_v1.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP archive not found"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip


      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -oq \
            "$GITHUB_WORKSPACE/Block_Buddies_Android_APK_Project_v1.zip" \
            -d "$GITHUB_WORKSPACE/android-project"

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/android-project" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Gradle settings file not found in ZIP"
            find "$GITHUB_WORKSPACE/android-project" -maxdepth 5 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app module build file not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Prepare local Three.js runtime
        shell: bash
        run: |
          set -euo pipefail
          npm pack three@0.180.0 --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/three-package" "$GITHUB_WORKSPACE/site/vendor"
          tar -xzf "$RUNNER_TEMP/three-0.180.0.tgz" -C "$RUNNER_TEMP/three-package"
          rm -rf "$GITHUB_WORKSPACE/site/vendor/three"
          cp -a "$RUNNER_TEMP/three-package/package" "$GITHUB_WORKSPACE/site/vendor/three"
          test -s "$GITHUB_WORKSPACE/site/vendor/three/build/three.module.js"
          test -s "$GITHUB_WORKSPACE/site/vendor/three/examples/jsm/loaders/GLTFLoader.js"
          echo "Prepared pinned local Three.js 0.180.0 runtime"
          node "$GITHUB_WORKSPACE/site/validate-3d-runtime.mjs"

      - name: Sync latest game and fix Android activity
        shell: bash
        run: |
          set -euo pipefail

          ASSET_INDEX="$(find "$PROJECT_DIR/app/src/main" -type f -path '*/assets/*' -name index.html -print -quit)"

          if [ -z "$ASSET_INDEX" ]; then
            echo "::error::Android assets/index.html not found"
            find "$PROJECT_DIR/app/src/main" -maxdepth 6 -type f | sort
            exit 1
          fi

          cp "$GITHUB_WORKSPACE/site/index.html" "$ASSET_INDEX"
          ASSET_DIR="$(dirname "$ASSET_INDEX")"

          # Keep every local dependency referenced by index.html beside it in
          # Android assets. Copying index.html alone silently disables the 3D
          # modules and the visual theme inside the WebView APK.
          for asset in favicon.svg visual-overhaul.css visual-3d.js arena-3d.js; do
            SOURCE="$GITHUB_WORKSPACE/site/$asset"
            if [ ! -s "$SOURCE" ]; then
              echo "::error::Required web asset is missing: $SOURCE"
              exit 1
            fi
            cp "$SOURCE" "$ASSET_DIR/$asset"
          done

          if [ ! -d "$GITHUB_WORKSPACE/site/characters" ]; then
            echo "::error::Character asset directory is missing"
            exit 1
          fi
          mkdir -p "$ASSET_DIR/characters"
          cp -a "$GITHUB_WORKSPACE/site/characters/." "$ASSET_DIR/characters/"

          # Preserve the premium space background and the 3D galaxy atlas in
          # the offline Android WebView package. These were present on the web
          # build but were omitted from the APK asset sync.
          for asset in universes-3d.js; do
            SOURCE="$GITHUB_WORKSPACE/site/$asset"
            if [ ! -s "$SOURCE" ]; then
              echo "::error::Required universe runtime is missing: $SOURCE"
              exit 1
            fi
            cp "$SOURCE" "$ASSET_DIR/$asset"
          done
          for dir in assets universes; do
            SOURCE_DIR="$GITHUB_WORKSPACE/site/$dir"
            if [ ! -d "$SOURCE_DIR" ]; then
              echo "::error::Required visual asset directory is missing: $SOURCE_DIR"
              exit 1
            fi
            mkdir -p "$ASSET_DIR/$dir"
            cp -a "$SOURCE_DIR/." "$ASSET_DIR/$dir/"
          done
          test -s "$ASSET_DIR/assets/deep_space_no_sun_2k.webp"
          test -s "$ASSET_DIR/assets/space-nebula-01.png"
          test -s "$ASSET_DIR/universes/manifest.json"
          test -s "$ASSET_DIR/universes-3d.js"
          echo "Synced space backgrounds and 3D universe atlas into Android assets"
          # Download every GLB into the APK and rewrite only the packaged manifest.
          # The website keeps its remote URLs; Android becomes fully offline for universe models.
          python3 - "$ASSET_DIR/universes/manifest.json" "$ASSET_DIR/universes/models" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          models_dir = pathlib.Path(sys.argv[2])
          models_dir.mkdir(parents=True, exist_ok=True)
          manifest = json.loads(manifest_path.read_text())
          models = manifest.get("models", {})
          if len(models) != 40:
              raise SystemExit(f"Expected 40 universe models, found {len(models)}")
          if len(manifest.get("universeOrder", [])) != len(models):
              raise SystemExit("universeOrder must list every packaged model exactly once")
          if set(manifest["universeOrder"]) != set(models):
              raise SystemExit("universeOrder and model manifest IDs do not match")
          if manifest.get("license", {}).get("name") != "CC0 1.0 Universal":
              raise SystemExit("The model collection license must be recorded as CC0 1.0")
          filenames = [entry.get("file") for entry in models.values()]
          if len(filenames) != len(set(filenames)):
              raise SystemExit("Universe model filenames must be unique")
          for model_id, entry in models.items():
              if not entry.get("sourcePage", "").startswith("https://"):
                  raise SystemExit(f"Missing original source page for {model_id}")
              url = entry.get("url", "")
              filename = pathlib.Path(entry.get("file", "")).name
              if not url.startswith("https://") or not filename.endswith(".glb"):
                  raise SystemExit(f"Invalid GLB metadata for {model_id}")
              target = models_dir / filename
              subprocess.run([
                  "curl", "--fail", "--location", "--retry", "3",
                  "--retry-all-errors", "--connect-timeout", "20",
                  "--max-time", "240", "--user-agent", "TetriosLX-Android-Asset-Bundler/1.0",
                  url, "--output", str(target)
              ], check=True)
              with target.open("rb") as stream:
                  magic = stream.read(4)
              if magic != b"glTF" or target.stat().st_size < 1024:
                  raise SystemExit(f"Invalid or incomplete GLB: {target}")
              entry["url"] = "./universes/models/" + filename
              print(f"Bundled {model_id}: {target.stat().st_size} bytes")
          manifest["loading"] = "All 40 GLB universe models are bundled locally for offline Android use."
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          PY
          test "$(find "$ASSET_DIR/universes/models" -maxdepth 1 -type f -name '*.glb' | wc -l)" -eq 40
          echo "Bundled all 40 diverse universe models locally in APK"

          if [ ! -s "$GITHUB_WORKSPACE/site/audio/chills.mp3" ]; then
            echo "::error::Bundled soundtrack is missing"
            exit 1
          fi
          mkdir -p "$ASSET_DIR/audio"
          cp "$GITHUB_WORKSPACE/site/audio/chills.mp3" "$ASSET_DIR/audio/chills.mp3"
          test -s "$ASSET_DIR/audio/chills.mp3"
          echo "Synced offline soundtrack into Android assets: $ASSET_DIR/audio/chills.mp3"

          for asset in index.html favicon.svg visual-overhaul.css visual-3d.js arena-3d.js; do
            if [ ! -s "$ASSET_DIR/$asset" ]; then
              echo "::error::Android WebView asset was not synced: $asset"
              exit 1
            fi
          done
          for asset in universes-3d.js assets/deep_space_no_sun_2k.webp assets/space-nebula-01.png universes/manifest.json; do
            if [ ! -s "$ASSET_DIR/$asset" ]; then
              echo "::error::Android space/universe asset was not synced: $asset"
              exit 1
            fi
          done
          echo "Synced game and 3D dependencies into Android assets: $ASSET_DIR"
          if [ ! -d "$GITHUB_WORKSPACE/site/vendor/three" ]; then
            echo "::error::Local Three.js runtime was not prepared"
            exit 1
          fi
          mkdir -p "$ASSET_DIR/vendor"
          rm -rf "$ASSET_DIR/vendor/three"
          cp -a "$GITHUB_WORKSPACE/site/vendor/three" "$ASSET_DIR/vendor/three"
          test -s "$ASSET_DIR/vendor/three/build/three.module.js"
          test -s "$ASSET_DIR/vendor/three/examples/jsm/loaders/GLTFLoader.js"
          echo "Synced local Three.js runtime into Android assets: $ASSET_DIR/vendor/three"

          echo "Synced latest game: $ASSET_INDEX"

          MAIN_ACTIVITY="$(find "$PROJECT_DIR/app/src/main/java" -type f -name MainActivity.java -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.java not found"
            exit 1
          fi

          python3 "$GITHUB_WORKSPACE/scripts/patch-android-webview.py" "$PROJECT_DIR"
          grep -q 'WebViewAssetLoader' "$MAIN_ACTIVITY"
          grep -q 'appassets.androidplatform.net/assets/index.html' "$MAIN_ACTIVITY"
          echo "Hardened Android WebView with local HTTPS asset origin"

          # Use one stable debug signing identity across CI builds so Android can update
          # the installed test APK in place instead of requiring uninstall/reinstall.
          mkdir -p "$RUNNER_TEMP/tetrios-signing"
          base64 --decode "$GITHUB_WORKSPACE/android/debug-signing.keystore.b64" \
            > "$RUNNER_TEMP/tetrios-signing/debug.keystore"
          export TETRIOS_DEBUG_KEYSTORE="$RUNNER_TEMP/tetrios-signing/debug.keystore"
          export TETRIOS_DEBUG_STORE_PASSWORD="tetrios-debug-only"
          export TETRIOS_DEBUG_KEY_ALIAS="tetrios-debug"
          export TETRIOS_DEBUG_KEY_PASSWORD="tetrios-debug-only"
          {
            echo "TETRIOS_DEBUG_KEYSTORE=$RUNNER_TEMP/tetrios-signing/debug.keystore"
            echo "TETRIOS_DEBUG_STORE_PASSWORD=tetrios-debug-only"
            echo "TETRIOS_DEBUG_KEY_ALIAS=tetrios-debug"
            echo "TETRIOS_DEBUG_KEY_PASSWORD=tetrios-debug-only"
          } >> "$GITHUB_ENV"
          keytool -list -keystore "$TETRIOS_DEBUG_KEYSTORE" -storepass "$TETRIOS_DEBUG_STORE_PASSWORD" -alias "$TETRIOS_DEBUG_KEY_ALIAS" >/dev/null
          python3 "$GITHUB_WORKSPACE/scripts/configure-stable-android-debug-signing.py" "$PROJECT_DIR"
          echo "Configured persistent debug signing for in-place APK updates"

      - name: Install Android SDK components
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"


      - name: Build APK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if ! command -v gradle >/dev/null 2>&1; then
            echo "::error::Gradle is not installed"
            exit 1
          fi

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew

          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Block-Buddies-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare stable APK download
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk" "$GITHUB_WORKSPACE/Block-Buddies.apk"
          test -s "$GITHUB_WORKSPACE/Block-Buddies.apk"

      - name: Publish latest APK download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Tetrios.LX — Android APK
          body: |
            Автоматически собранная Android-версия Block Buddies из актуальной версии сайта.
            Файл Block-Buddies.apk можно установить на Android. Это debug-сборка.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: Block-Buddies.apk

      - name: Stage APK for direct website download
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/site/download"
          cp "$GITHUB_WORKSPACE/Block-Buddies.apk" "$GITHUB_WORKSPACE/site/download/Block-Buddies.apk"
          test -s "$GITHUB_WORKSPACE/site/download/Block-Buddies.apk"

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload website and APK to Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website and direct APK
        if: github.ref == 'refs/heads/main'
        id: pages-deployment
        uses: actions/deploy-pages@v4
