
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'


      - name: Inspect project sources
        shell: bash
        run: |
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "=== Project files ==="
          find "$PROJECT_DIR" -maxdepth 5 -type f \
            ! -path "*/.gradle/*" \
            ! -path "*/build/*" \
            | sort | head -300
          echo "=== Android source files ==="
          find "$PROJECT_DIR" -type f \
            \( -name "*.kt" -o -name "*.java" -o -name "*.xml" -o -name "*.gradle" -o -name "*.kts" \) \
            ! -path "*/.gradle/*" \
            ! -path "*/build/*" \
            | sort | head -300

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockDrop-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
