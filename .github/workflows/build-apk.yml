<script>
/* ============================================================
   AUDIO ENGINE
   ============================================================ */
const Audio = {
  ctx: null, master: null, musicGain: null, sfxGain: null,
  musicPlaying: false, musicTimer: null, beat: 0,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.6;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.1;
      this.musicGain.connect(this.master);
      this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.35;
      this.sfxGain.connect(this.master);
    } catch(e){}
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  sfx(type) {
    if (!this.ctx || !P.sfxOn) return;
    this.resume();
    const now = this.ctx.currentTime;
    const play = (freq, dur, wave, vol, when=0) => {
      const o = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      o.type = wave || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, now+when);
      g.gain.linearRampToValueAtTime(vol||0.4, now+when+0.01);
      g.gain.exponentialRampToValueAtTime(0.001, now+when+dur);
      o.connect(g); g.connect(this.sfxGain);
      o.start(now+when); o.stop(now+when+dur+0.05);
    };
    switch(type) {
      case 'move':    play(440, 0.04, 'square', 0.15); break;
      case 'rotate':  play(660, 0.06, 'sine', 0.25); break;
      case 'drop':    play(180, 0.12, 'sawtooth', 0.3); break;
      case 'lock':    play(220, 0.08, 'square', 0.2); break;
      case 'clear':   play(880,0.12,'triangle',0.35); play(1100,0.12,'triangle',0.3,0.06); play(1320,0.15,'triangle',0.25,0.12); break;
      case 'tetris':  play(880,0.15,'square',0.4); play(1100,0.15,'square',0.4,0.1); play(1320,0.15,'square',0.4,0.2); play(1760,0.3,'square',0.4,0.3); break;
      case 'levelup': play(523,0.1,'sine',0.4); play(659,0.1,'sine',0.4,0.08); play(784,0.15,'sine',0.4,0.16); play(1046,0.25,'sine',0.4,0.24); break;
      case 'click':   play(880, 0.04, 'square', 0.15); break;
      case 'purchase': play(660,0.08,'triangle',0.3); play(880,0.12,'triangle',0.3,0.06); break;
      case 'gameover': play(440,0.2,'sawtooth',0.3); play(330,0.2,'sawtooth',0.3,0.2); play(220,0.4,'sawtooth',0.3,0.4); break;
      case 'error':   play(200,0.1,'square',0.3); play(150,0.15,'square',0.3,0.1); break;
      case 'coin':    play(1320,0.05,'sine',0.3); play(1760,0.08,'sine',0.3,0.05); break;
      case 'upgrade': play(523,0.12,'triangle',0.35); play(784,0.15,'triangle',0.35,0.1); play(1046,0.2,'triangle',0.35,0.2); break;
    }
  },
  startMusic() {
    if (!this.ctx || this.musicPlaying || !P.musicOn) return;
    this.musicPlaying = true;
    this.beat = 0;
    const loop = () => {
      if (!this.musicPlaying) return;
      const chords = [[261.6,329.6,392.0],[293.7,349.2,440.0],[329.6,392.0,493.9],[349.2,440.0,523.3]];
      const chord = chords[this.beat % 4];
      const now = this.ctx.currentTime;
      // Bass
      this.mNote(chord[0]/2, 0.3, 'triangle', 0.4);
      // Arpeggio
      for (let i=0;i<chord.length;i++) {
        this.mNote(chord[i], 0.18, 'sine', 0.15, i*0.1);
      }
      // High melody
      if (this.beat % 2 === 0) {
        this.mNote(chord[2]*2, 0.12, 'square', 0.06, 0.2);
      }
      this.beat++;
      this.musicTimer = setTimeout(loop, 420);
    };
    loop();
  },
  mNote(freq, dur, wave, vol, delay=0) {
    if (!this.ctx || !P.musicOn) return;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = wave; o.frequency.value = freq;
    const t = this.ctx.currentTime + delay;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t+dur);
    o.connect(g); g.connect(this.musicGain);
    o.start(t); o.stop(t+dur+0.05);
  },
  stopMusic() { this.musicPlaying = false; if (this.musicTimer) clearTimeout(this.musicTimer); }
};

