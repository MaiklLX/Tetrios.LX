name: Build Block Buddies APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Verify ZIP archive
        shell: bash
        run: |
          set -e
          ZIP_FILE="$GITHUB_WORKSPACE/Block_Buddies_Android_APK_Project.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP archive not found: $ZIP_FILE"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/android-project"
          unzip -oq "$GITHUB_WORKSPACE/Block_Buddies_Android_APK_Project.zip" \
            -d "$GITHUB_WORKSPACE/android-project"

          find "$GITHUB_WORKSPACE/android-project" \
            -maxdepth 5 -type f | head -150

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/android-project" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No Gradle settings file found in the ZIP"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app module build file not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -f gradlew ]; then
            echo "::error::gradlew is missing from the ZIP archive"
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Block-Buddies-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
