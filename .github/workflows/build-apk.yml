
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract project
        run: |
          ARCHIVE=$(find . -maxdepth 4 -type f -iname "BlockDrop_NoAds_Project.zip" -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: BlockDrop_NoAds_Project.zip not found"
            exit 1
          fi
          mkdir -p extracted
          unzip -oq "$ARCHIVE" -d extracted
          PROJECT_FILE=$(find extracted -type f -name settings.gradle -print -quit)
          if [ -z "$PROJECT_FILE" ]; then
            PROJECT_FILE=$(find extracted -type f -name settings.gradle.kts -print -quit)
          fi
          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found in archive"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockDrop-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
