function showModal(title, content, buttons) {
  const card = $('modalCard');
  card.innerHTML = `<div style="font-size:26px;font-weight:900;margin-bottom:12px">${title}</div>
    <div style="margin-bottom:18px;line-height:1.5">${content}</div>
    <div style="display:flex;flex-direction:column;gap:8px" id="modalBtns"></div>`;
  const btns = card.querySelector('#modalBtns');
  buttons.forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls||'');
    el.textContent = b.label;
    el.addEventListener('click', () => { Audio.sfx('click'); b.fn(); });
    btns.appendChild(el);
  });
  $('modalOverlay').classList.add('show');
}
function hideModal() { $('modalOverlay').classList.remove('show'); }

/* ============================================================
   ИГРОВОЙ ДВИЖОК
   ============================================================ */
const Game = {
  cols:10, rows:20,
  grid: [], player: null, next: null, next2: null, bag: [],
  score: 0, lines: 0, level: 1, dropInterval: 1000, dropCounter: 0,
  lastTime: 0, animId: null,
  paused: false, gameOver: false, mode: null,
  coinsEarned: 0, gemsEarned: 0, startTime: 0,
  activeUpgrades: {}, // roguelike
  activeBoosts: {}, // boosts used
  campaignLevel: null,
  comboCount: 0,
  shield: 0, lives: 1, overflowCount: 0,
  block: 24, canvas: null, ctx: null, nextCanvas: null, nctx: null,
  ghostVisible: false,
  freezeActive: false, freezeUntil: 0,
  rlTargetLines: 5, // roguelike next level
  dailyMod: null,
  lastClearWasTetris: false,
  pendingUndo: null,
  isPaused: false,

  init(canvasId, nextId) {
    this.canvas = document.getElementById(canvasId);
    this.ctx = this.canvas.getContext('2d');
    this.nextCanvas = document.getElementById(nextId);
    this.nctx = this.nextCanvas.getContext('2d');
  },

  start(mode, opts = {}) {
    this.mode = mode;
    this.opts = opts;
    this.cols = 10; this.rows = 20;
    this.activeUpgrades = {};
    this.activeBoosts = {};
    this.shield = 0; this.lives = 1; this.overflowCount = 0;
    this.comboCount = 0;
    this.coinsEarned = 0; this.gemsEarned = 0;
    this.paused = false; this.gameOver = false;
    this.isPaused = false;
    this.score = 0; this.lines = 0; this.level = 1;
    this.dropInterval = 1000; this.dropCounter = 0;
    this.startTime = Date.now();
    this.grid = Array.from({length:this.rows}, () => new Array(this.cols).fill(0));
    this.bag = [];
    this.lastTime = performance.now();
    this.ghostVisible = true;
    this.pendingUndo = null;
    this.freezeActive = false;
    this.rlTargetLines = 5;
    this.campaignLevel = opts.level || null;

    // Applied upgrades from run (for roguelike these accumulate)
    if (opts.upgrades) {
      opts.upgrades.forEach(u => this.applyUpgrade(u));
    }

    // Campaign level speed
    if (mode === 'campaign' && opts.level) {
      this.dropInterval = opts.level.startSpeed;
    }
    // Daily modifier
    if (mode === 'daily') {
      const day = new Date().getDay();
      this.dailyMod = DAILY_MODIFIERS[day];
      this.dropInterval = Math.round(1000 * this.dailyMod.speedMult);
    }

    // Start with bonus line upgrade
    if (this.activeUpgrades.bonusline) {
      for (let c=0;c<this.cols;c++) this.grid[this.rows-1][c] = 1 + rand(7);
      this.lines = 1;
    }

    // Start coins upgrade
    if (this.activeUpgrades.startcoins) this.coinsEarned += 50;

    this.next = this.makePiece(this.nextType());
    this.next2 = this.activeUpgrades.preview2 ? this.makePiece(this.nextType()) : null;
    this.spawn();
    this.updateHUD();
    this.updateGoalDisplay();
    this.renderBoosts();

    if (this.animId) cancelAnimationFrame(this.animId);
    this.loop = this.loop.bind(this);
    this.animId = requestAnimationFrame(this.loop);

    showScreen('gameScreen');
    this.resize();
  },

  makePiece(type) {
    const m = SHAPES[type].map(r => r.slice());
    let top = 0;
    while (top < m.length && m[top].every(v => !v)) top++;
    let x = Math.floor((this.cols - m[0].length) / 2);
    if (this.activeUpgrades.magnet) x = Math.floor((this.cols - m[0].length) / 2);
    return { matrix: m, type, x, y: -top };
  },

  nextType() {
    if (!this.bag.length) {
      this.bag = ['I','J','L','O','S','T','Z'].slice();
      shuffle(this.bag);
    }
    return this.bag.pop();
  },

  spawn() {
    this.player = this.next;
    this.next = this.next2 || this.makePiece(this.nextType());
    this.next2 = this.activeUpgrades.preview2 ? this.makePiece(this.nextType()) : null;
    this.drawNext();
    if (this.collide(this.player)) {
      this.handleOverflow();
    }
  },

  collide(p) {
    const m = p.matrix;
    for (let y=0;y<m.length;y++) for (let x=0;x<m[y].length;x++) {
      if (!m[y][x]) continue;
      const ny = p.y+y, nx = p.x+x;
      if (nx<0 || nx>=this.cols || ny>=this.rows) return true;
      if (ny>=0 && this.grid[ny][nx]) return true;
    }
    return false;
  },

  move(dir) {
    if (this.paused || this.gameOver) return;
    this.player.x += dir;
    if (this.collide(this.player)) this.player.x -= dir;
    else Audio.sfx('move');
  },

  rotate(dir = 1) {
    if (this.paused || this.gameOver) return;
    const oldM = this.player.matrix;
    const oldX = this.player.x;
    const oldY = this.player.y;
    const N = oldM.length;
    const r = oldM.map(row => row.slice());
    for (let y=0;y<N;y++) for (let x=0;x<N;x++) {
      if (dir>0) r[x][N-1-y] = oldM[y][x];
      else r[N-1-x][y] = oldM[y][x];
    }
    this.player.matrix = r;
    const kicks = [[0,0],[-1,0],[1,0],[-2,0],[2,0],[0,-1],[-1,-1],[1,-1]];
    for (const k of kicks) {
      this.player.x = oldX + k[0];
      this.player.y = oldY + k[1];
      if (!this.collide(this.player)) { Audio.sfx('rotate'); return; }
    }
    this.player.matrix = oldM;
    this.player.x = oldX;
    this.player.y = oldY;
  },

  softDrop() {
    if (this.paused || this.gameOver) return;
    this.player.y++;
    if (this.collide(this.player)) {
      this.player.y--;
      this.lock();
    } else {
      this.score += 1;
      this.updateHUD();
    }
    this.dropCounter = 0;
  },

  hardDrop() {
    if (this.paused || this.gameOver) return;
    this.pendingUndo = {
      matrix: this.player.matrix.map(r => r.slice()),
      x: this.player.x, y: this.player.y, grid: this.grid.map(r => r.slice())
    };
    let dist = 0;
    while (true) {
      this.player.y++;
      if (this.collide(this.player)) { this.player.y--; break; }
      dist++;
    }
    this.score += dist * (this.activeUpgrades.hdropscore ? 6 : 2);
    Audio.sfx('drop'); buzz(15);
    this.lock();
  },

  lock() {
    const m = this.player.matrix;
    for (let y=0;y<m.length;y++) for (let x=0;x<m[y].length;x++) {
      if (!m[y][x]) continue;
      const ny = this.player.y + y, nx = this.player.x + x;
      if (ny>=0 && ny<this.rows && nx>=0 && nx<this.cols) this.grid[ny][nx] = m[y][x];
    }
    const cleared = this.clearLines();
    if (cleared > 0) {
      this.handleClear(cleared);
    }
    this.comboCount = cleared > 0 ? this.comboCount + 1 : 0;
    Audio.sfx('lock');
    this.dropCounter = 0;
    this.spawn();
    this.updateHUD();
  },

  clearLines() {
    let count = 0;
    for (let y=this.rows-1;y>=0;y--) {
      let full = true;
      for (let x=0;x<this.cols;x++) if (!this.grid[y][x]) { full = false; break; }
      if (full) {
        this.grid.splice(y, 1);
        this.grid.unshift(new Array(this.cols).fill(0));
        count++; y++;
      }
    }
    return count;
  },

  handleClear(n) {
    let base = [0,100,300,500,800][n] || 800;
    if (n === 4 && this.activeUpgrades.tetris) base = Math.round(base * 1.5);
    if (n === 4 && this.activeUpgrades.bomb) {
      // clear another line
      for (let y=this.rows-1;y>=0;y--) {
        if (this.grid[y].some(c=>c)) {
          this.grid.splice(y,1);
          this.grid.unshift(new Array(this.cols).fill(0));
          break;
        }
      }
    }
    let mult = 1;
    if (this.activeUpgrades.score1) mult *= 1.2;
    if (this.activeUpgrades.score2) mult *= 1.4;
    if (this.activeUpgrades.fast) mult *= 1.3;
    if (this.activeUpgrades.combo && this.comboCount > 0) mult *= 2;
    if (this.activeUpgrades.firstscore && this.lines < 5) mult *= 2;
    if (this.activeUpgrades.lucky && Math.random() < 0.15) mult *= 3;
    if (this.activeUpgrades.crit && Math.random() < 0.10) mult *= 4;
    if (this.dailyMod) {
      if (this.dailyMod.name.includes('Комбо') && this.comboCount > 0) mult *= 2;
      if (this.dailyMod.name.includes('Испытание')) mult *= 2;
    }
    this.score += Math.round(base * mult * this.level);
    this.lines += n;

    // Coins
    let coinGain = 0;
    if (this.activeUpgrades.coin) coinGain += 3 * n;
    if (this.activeUpgrades.doublecoin) coinGain *= 2;
    if (this.dailyMod && this.dailyMod.name.includes('Клад')) coinGain *= 3;
    else if (this.dailyMod && this.dailyMod.name.includes('Отдых')) coinGain = Math.floor(coinGain * 1.5);
    coinGain += n; // base 1 per line
    this.coinsEarned += coinGain;

    // Gems
    if (this.activeUpgrades.gems && Math.floor(this.lines/10) > Math.floor((this.lines-n)/10)) {
      this.gemsEarned += 1;
    }

    // Shield from fortress
    if (this.activeUpgrades.fortress && Math.floor(this.lines/5) > Math.floor((this.lines-n)/5)) {
      this.shield = (this.shield||0) + 1;
    }

    // Visual
    this.flashScreen();
    Audio.sfx(n===4?'tetris':'clear');

    // Level up
    const newLevel = 1 + Math.floor(this.lines / 10);
    if (newLevel > this.level) {
      this.level = newLevel;
      this.updateLevelSpeed();
      Audio.sfx('levelup');
      this.showParticles('LEVEL UP!', '#ffb800');
      if (this.mode === 'roguelike') this.triggerRoguelikeLevelUp();
    }

    // Roguelike target
    if (this.mode === 'roguelike') {
      if (this.lines >= this.rlTargetLines) {
        this.rlTargetLines += Math.floor(this.rlTargetLines * 0.6) + 3;
        this.triggerRoguelikeLevelUp();
      }
    }

    // Campaign check
    if (this.mode === 'campaign' && this.campaignLevel) {
      const cl = this.campaignLevel;
      const achieved = cl.goalType==='score' ? this.score >= cl.goalValue : this.lines >= cl.goalValue;
      if (achieved) {
        setTimeout(() => this.campaignWin(), 400);
      }
    }
  },

  updateLevelSpeed() {
    let interval = Math.max(60, 1000 * Math.pow(0.82, this.level - 1));
    if (this.activeUpgrades.slow) interval *= 1.15;
    if (this.activeUpgrades.fast) interval *= 0.9;
    if (this.activeUpgrades.slowstart && this.level <= 3) interval *= 1.2;
    if (this.dailyMod) interval *= this.dailyMod.speedMult;
    this.dropInterval = interval;
  },

  handleOverflow() {
    if (this.shield > 0) {
      this.shield--;
      this.grid = Array.from({length:this.rows}, () => new Array(this.cols).fill(0));
      this.showParticles('🛡️ ЩИТ!', '#5b8def');
      Audio.sfx('shield' in Audio ? 'shield' : 'error');
      this.spawn();
      return;
    }
    if (this.activeUpgrades.life) {
      this.activeUpgrades.life = false;
      this.grid = Array.from({length:this.rows}, () => new Array(this.cols).fill(0));
      this.showParticles('❤️ ЖИЗНЬ!', '#fb7185');
      Audio.sfx('levelup');
      this.spawn();
      return;
    }
    if (this.activeUpgrades.zen && this.overflowCount < 2) {
      this.overflowCount++;
      this.grid = Array.from({length:this.rows}, () => new Array(this.cols).fill(0));
      this.showParticles('🧘 ДЗЕН ' + this.overflowCount + '/3', '#a78bfa');
      Audio.sfx('upgrade');
      this.spawn();
      return;
    }
    if (this.activeBoosts.shield) {
      this.activeBoosts.shield = false;
      this.grid = Array.from({length:this.rows}, () => new Array(this.cols).fill(0));
      this.showParticles('🛡️ БУСТ!', '#5b8def');
      Audio.sfx('upgrade');
      this.spawn();
      return;
    }
    this.endGame();
  },

  triggerRoguelikeLevelUp() {
    this.paused = true;
    setTimeout(() => {
      showUpgradePicker();
    }, 300);
  },

  campaignWin() {
    this.paused = true;
    const lvl = this.campaignLevel;
    // Stars based on score
    let stars = 1;
    if (this.score >= lvl.goalValue * 2.5) stars = 3;
    else if (this.score >= lvl.goalValue * 1.5) stars = 2;
    const prev = P.campaignStars[lvl.id] || 0;
    if (stars > prev) P.campaignStars[lvl.id] = stars;
    if (lvl.id >= P.campaignProgress) P.campaignProgress = lvl.id + 1;
    addCoins(this.coinsEarned);
    addXP(Math.floor(this.score / 10));
    save();
    this.gameOver = true;
    Audio.sfx('levelup');
    showModal('⭐ ПОБЕДА! ⭐',
      `Уровень пройден!<br><br>Счёт: <b>${fmt(this.score)}</b><br>Звёзды: ${'⭐'.repeat(stars)}`,
      [{label:'ПРОДОЛЖИТЬ', cls:'primary', fn:()=>{hideModal();showScreen('campaignScreen');renderCampaign();updateMenuBar();}}]);
  },

  endGame() {
    if (this.gameOver) return;
    this.gameOver = true;
    Audio.sfx('gameover');
    buzz([50,100,50,100,200]);

    // Rewards
    addCoins(this.coinsEarned);
    addGems(this.gemsEarned);
    const xpGain = Math.floor(this.score / 8) + this.lines * 2;
    addXP(this.activeUpgrades.xpboost ? Math.floor(xpGain * 1.3) : xpGain);

    if (this.score > P.bestScore) P.bestScore = this.score;
    if (this.mode === 'roguelike' && this.score > P.roguelikeBest) P.roguelikeBest = this.score;
    P.gamesPlayed = (P.gamesPlayed||0) + 1;
    P.totalLines = (P.totalLines||0) + this.lines;
    save();

    $('go-icon').textContent = this.mode==='roguelike' ? '🎲' : (this.mode==='daily' ? '📅' : '💀');
    $('go-title').textContent = this.mode==='roguelike' ? 'ЗАБЕГ ОКОНЧЕН' : 'ИГРА ОКОНЧЕНА';
    $('go-sub').textContent = `Счёт: ${fmt(this.score)}`;
    $('go-score').textContent = fmt(this.score);
    $('go-lines').textContent = this.lines;
    $('go-coins').textContent = '+' + fmt(this.coinsEarned);
    $('go-xp').textContent = '+' + xpGain;
    showScreen('gameOverScreen');
    updateMenuBar();
  },

  loop(t) {
    this.animId = requestAnimationFrame(this.loop);
    const dt = Math.min(t - this.lastTime, 120);
    this.lastTime = t;

    if (!this.paused && !this.gameOver && this.player) {
      const now = Date.now();
      if (!this.freezeActive || now > this.freezeUntil) {
        this.freezeActive = false;
        this.dropCounter += dt;
        if (this.dropCounter >= this.dropInterval) {
          this.dropCounter = 0;
          this.player.y++;
          if (this.collide(this.player)) {
            this.player.y--;
            this.lock();
          }
        }
      }
    }
    this.draw();
  },

  drawCell(ctx, px, py, s, colorIdx) {
    const c = COLORS[colorIdx];
    const base = c[0], light = c[1];
    const pad = Math.max(1, s*0.05);
    const r = Math.max(2, s*0.18);
    const grad = ctx.createLinearGradient(0, py+pad, 0, py+s-pad);
    grad.addColorStop(0, light); grad.addColorStop(0.5, base); grad.addColorStop(1, base);
    ctx.fillStyle = grad;
    roundRect(ctx, px+pad, py+pad, s-pad*2, s-pad*2, r);
    ctx.fill();
    // highlight
    ctx.globalAlpha = 0.35; ctx.fillStyle = '#fff';
    roundRect(ctx, px+pad+s*0.14, py+pad+s*0.12, s-pad*2-s*0.28, s*0.14, r*0.7);
    ctx.fill();
    ctx.globalAlpha = 1;
    // eyes (cartoon style for active player)
    if (colorIdx > 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      const eyeY = py + s*0.55;
      const eyeR = s*0.08;
      ctx.beginPath(); ctx.arc(px+s*0.35, eyeY, eyeR, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(px+s*0.65, eyeY, eyeR, 0, 6.28); ctx.fill();
    }
  },

  drawMatrix(ctx, m, ox, oy, ghost) {
    for (let y=0;y<m.length;y++) for (let x=0;x<m[y].length;x++) {
      if (!m[y][x]) continue;
      const gy = oy + y;
      if (gy < 0) continue;
      const px = (ox+x)*this.block, py = gy*this.block;
      if (ghost) {
        const pad = Math.max(1, this.block*0.05);
        const r = Math.max(2, this.block*0.18);
        ctx.save();
        ctx.globalAlpha = 0.28;
        ctx.strokeStyle = COLORS[m[y][x]][0];
        ctx.lineWidth = Math.max(1.5, this.block*0.08);
        roundRect(ctx, px+pad+1, py+pad+1, this.block-pad*2-2, this.block-pad*2-2, r);
        ctx.stroke();
        ctx.restore();
      } else {
        this.drawCell(ctx, px, py, this.block, m[y][x]);
      }
    }
  },

  ghostY() {
    if (!this.player) return 0;
    let y = this.player.y;
    while (true) {
      const test = {matrix:this.player.matrix, x:this.player.x, y:y+1};
      if (this.collide(test)) break;
      y++;
    }
    return y;
  },

  draw() {
    const w = this.cols * this.block, h = this.rows * this.block;
    const ctx = this.ctx;
    ctx.clearRect(0, 0, w, h);
    // bg
    const bgGrad = ctx.createLinearGradient(0,0,0,h);
    bgGrad.addColorStop(0,'#0a0413'); bgGrad.addColorStop(1,'#1a0b2e');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0,0,w,h);
    // grid
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x=1;x<this.cols;x++){ctx.moveTo(x*this.block+0.5,0);ctx.lineTo(x*this.block+0.5,h);}
    for (let y=1;y<this.rows;y++){ctx.moveTo(0,y*this.block+0.5);ctx.lineTo(w,y*this.block+0.5);}
    ctx.stroke();
    // grid cells
    for (let y=0;y<this.rows;y++) for (let x=0;x<this.cols;x++) {
      if (this.grid[y][x]) this.drawCell(ctx, x*this.block, y*this.block, this.block, this.grid[y][x]);
    }
    // ghost + player
    if (this.player && !this.gameOver) {
      if (this.ghostVisible && !this.activeUpgrades.ghost) {
        const gy = this.ghostY();
        if (gy !== this.player.y) this.drawMatrix(ctx, this.player.matrix, this.player.x, gy, true);
      } else if (this.activeUpgrades.ghost) {
        const gy = this.ghostY();
        if (gy !== this.player.y) this.drawMatrix(ctx, this.player.matrix, this.player.x, gy, true);
      }
      this.drawMatrix(ctx, this.player.matrix, this.player.x, this.player.y, false);
    }
  },

  drawNext() {
    const nc = this.nctx;
    const size = 76;
    nc.clearRect(0,0,size,size);
    if (!this.next) return;
    const m = this.next.matrix;
    let minX=99,maxX=-1,minY=99,maxY=-1;
    for (let y=0;y<m.length;y++) for (let x=0;x<m[y].length;x++) {
      if (m[y][x]) { if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; }
    }
    if (maxX < 0) return;
    const wc = maxX-minX+1, hc = maxY-minY+1;
    const cs = Math.min(size/5, size*0.8/Math.max(wc,hc));
    const ox = (size-wc*cs)/2 - minX*cs;
    const oy = (size-hc*cs)/2 - minY*cs;
    for (let y=0;y<m.length;y++) for (let x=0;x<m[y].length;x++) {
      if (!m[y][x]) continue;
      this.drawCell(nc, ox+x*cs, oy+y*cs, cs, m[y][x]);
    }
  },

  resize() {
    const area = $('boardArea');
    const aw = area.clientWidth, ah = area.clientHeight;
    if (!aw || !ah) return;
    this.block = Math.floor(Math.min(aw/this.cols, ah/this.rows));
    this.block = Math.max(this.block, 8);
    const w = this.block*this.cols, h = this.block*this.rows;
    const dpr = window.devicePixelRatio || 1;
    this.canvas.style.width = w+'px';
    this.canvas.style.height = h+'px';
    this.canvas.width = Math.round(w*dpr);
    this.canvas.height = Math.round(h*dpr);
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    const nsize = 76;
    const nc = this.nextCanvas;
    nc.style.width = '38px'; nc.style.height = '38px';
    nc.width = Math.round(38*dpr); nc.height = Math.round(38*dpr);
    this.nctx.setTransform(dpr*38/nsize, 0, 0, dpr*38/nsize, 0, 0);
    this.draw();
    this.drawNext();
  },

  updateHUD() {
    $('g-score').textContent = fmt(this.score);
    $('g-level').textContent = this.level;
    $('g-lines').textContent = this.lines;
  },

  updateGoalDisplay() {
    if (this.mode === 'campaign' && this.campaignLevel) {
      const cl = this.campaignLevel;
      const current = cl.goalType === 'score' ? this.score : this.lines;
      $('g-goal').textContent = current + '/' + cl.goalValue;
    } else if (this.mode === 'roguelike') {
      $('g-goal').textContent = this.lines + '/' + this.rlTargetLines;
    } else if (this.mode === 'daily') {
      $('g-goal').textContent = '∞';
    } else {
      $('g-goal').textContent = '—';
    }
  },

  renderBoosts() {
    const row = $('boostRow');
    row.innerHTML = '';
    Object.keys(BOOSTS).forEach(id => {
      const count = P.inventory[id] || 0;
      const btn = document.createElement('div');
      btn.className = 'boost-btn' + (count===0?' empty':'');
      btn.innerHTML = BOOSTS[id].icon + (count>0?`<span class="cnt">${count}</span>`:'');
      btn.addEventListener('click', () => {
        if (this.paused || this.gameOver) return;
        if ((P.inventory[id]||0) > 0) {
          P.inventory[id]--;
          this.useBoost(id);
          save();
          this.renderBoosts();
        } else { Audio.sfx('error'); buzz(30); }
      });
      row.appendChild(btn);
    });
  },

  useBoost(id) {
    Audio.sfx('upgrade'); buzz(20);
    this.activeBoosts[id] = true;
    if (id === 'slow') {
      this.freezeActive = true; this.freezeUntil = Date.now() + 30000;
      this.showParticles('🐢 СЛОУ-МО', '#4ecdc4');
    } else if (id === 'double') {
      this.showParticles('💎 x2 ОЧКИ', '#a78bfa');
      const orig = this.score;
      this.doubleScoreUntil = Date.now() + 45000;
    } else if (id === 'coins') {
      this.showParticles('🪙 x2 МОНЕТЫ', '#ffb800');
      this.doubleCoinsUntil = Date.now() + 30000;
    } else if (id === 'bomb') {
      for (let y=this.rows-1;y>=0;y--) {
        if (this.grid[y].some(c=>c)) {
          this.grid.splice(y,1);
          this.grid.unshift(new Array(this.cols).fill(0));
          break;
        }
      }
      this.showParticles('💣 БУМ!', '#fb7185');
      Audio.sfx('clear');
    } else if (id === 'rainbow') {
      this.player.type = this.player.type; // next will be special
      this.showParticles('🌈 РАДУГА!', '#ffb800');
    } else if (id === 'shield') {
      this.shield = (this.shield||0) + 1;
      this.showParticles('🛡️ ЩИТ!', '#5b8def');
    }
  },

  applyUpgrade(id) {
    this.activeUpgrades[id] = true;
    if (id === 'ghost') this.ghostVisible = true;
  },

  showParticles(text, color) {
    const layer = $('fxLayer');
    const p = document.createElement('div');
    p.className = 'particle';
    p.textContent = text;
    p.style.color = color;
    p.style.left = '50%'; p.style.top = '40%';
    p.style.transform = 'translate(-50%,-50%)';
    p.style.fontSize = '24px';
    p.style.fontWeight = '900';
    p.style.textShadow = '0 2px 12px ' + color;
    layer.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  },

  flashScreen() {
    const layer = $('fxLayer');
    const flash = document.createElement('div');
    flash.style.cssText = `position:absolute;inset:0;background:rgba(255,184,0,.25);
      pointer-events:none;transition:opacity .3s`;
    layer.appendChild(flash);
    requestAnimationFrame(() => { flash.style.opacity = '0'; });
    setTimeout(() => flash.remove(), 400);
  },

  togglePause() {
    if (this.gameOver) return;
    this.paused = !this.paused;
    if (this.paused) {
      showModal('ПАУЗА', 'Игра приостановлена', [
        {label:'ПРОДОЛЖИТЬ', cls:'primary', fn:()=>{hideModal();this.paused=false;}},
        {label:'В МЕНЮ', fn:()=>{hideModal();this.gameOver=true;showScreen('menuScreen');updateMenuBar();}}
      ]);
    }
  }
};

/* ============================================================
   БУСТЫ - логика обновления таймеров
   ============================================================ */
setInterval(() => {
  if (Game.mode && !Game.paused && !Game.gameOver) {
    Game.updateGoalDisplay();
  }
}, 100);

/* ============================================================
   УПРАВЛЕНИЕ: ЖЕСТЫ + КНОПКИ
   ============================================================ */
function setupControls() {
  // Кнопки
  let holdTimers = {};
  const bindHold = (id, fn, delay=160, repeat=60) => {
    const el = document.getElementById(id);
    let t1 = null, t2 = null;
    const start = (e) => {
      e.preventDefault();
      fn();
      t1 = setTimeout(() => { t2 = setInterval(fn, repeat); }, delay);
    };
    const stop = () => { if (t1){clearTimeout(t1);t1=null;} if (t2){clearInterval(t2);t2=null;} };
    el.addEventListener('pointerdown', start);
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointercancel', stop);
    el.addEventListener('pointerleave', stop);
    el.addEventListener('contextmenu', e=>e.preventDefault());
  };
  bindHold('btnLeft', () => Game.move(-1));
  bindHold('btnRight', () => Game.move(1));
  bindHold('btnDown', () => Game.softDrop(), 180, 50);
  document.getElementById('btnRotate').addEventListener('pointerdown', e=>{e.preventDefault();Game.rotate(1);});
  document.getElementById('btnDrop').addEventListener('pointerdown', e=>{e.preventDefault();Game.hardDrop();});

  // Жесты на игровом поле
  const board = document.getElementById('boardArea');
  let touch = null;

  board.addEventListener('touchstart', (e) => {
    if (Game.paused || Game.gameOver) return;
    e.preventDefault();
    const t = e.changedTouches[0];
    touch = { x: t.clientX, y: t.clientY, sx: t.clientX, sy: t.clientY, st: Date.now(), moved: false };
  }, {passive:false});

  board.addEventListener('touchmove', (e) => {
    if (!touch || Game.paused || Game.gameOver) return;
    e.preventDefault();
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.x;
    const dy = t.clientY - touch.y;
    const th = Math.max(18, Game.block * 0.85);
    if (Math.abs(dx) >= th) {
      const dir = dx > 0 ? 1 : -1;
      Game.move(dir);
      touch.x += dir * th;
      touch.moved = true;
    }
    if (dy >= th) {
      Game.softDrop();
      touch.y += th;
      touch.moved = true;
    }
  }, {passive:false});

  board.addEventListener('touchend', (e) => {
    if (!touch) return;
    e.preventDefault();
    const t = e.changedTouches[0];
    const dt = Date.now() - touch.st;
    const dy = t.clientY - touch.sy;
    const dx = Math.abs(t.clientX - touch.sx);
    if (!touch.moved && dt < 300 && dx < 20) {
      // tap = rotate
      Game.rotate(1);
    } else if (dy > 100 && dy / Math.max(1,dt) > 0.8 && dx < 60) {
      // fast swipe down = hard drop
      Game.hardDrop();
    }
    touch = null;
  }, {passive:false});

  // Keyboard for desktop
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' '].includes(k)) {
      if (!document.getElementById('gameScreen').classList.contains('active')) return;
      e.preventDefault();
      if (k==='ArrowLeft') Game.move(-1);
      else if (k==='ArrowRight') Game.move(1);
      else if (k==='ArrowDown') Game.softDrop();
      else if (k==='ArrowUp') Game.rotate(1);
      else if (k===' ') Game.hardDrop();
    } else if (k==='p'||k==='P'||k==='Escape') {
      if (document.getElementById('gameScreen').classList.contains('active')) Game.togglePause();
    }
  });
}

/* ============================================================
   РОГАЛИК: ВЫБОР УЛУЧШЕНИЯ
   ============================================================ */
function showUpgradePicker() {
  const available = UPGRADES.filter(u => !Game.activeUpgrades[u.id]);
  const picks = [];
  const used = new Set();
  // 3 random unique
  while (picks.length < 3 && picks.length < available.length) {
    const u = choice(available);
    if (used.has(u.id)) continue;
    used.add(u.id);
    picks.push(u);
  }
  const container = $('upgradePick');
  container.innerHTML = '';
  picks.forEach(u => {
    const el = document.createElement('div');
    el.className = 'upgrade-option rarity-' + u.rarity;
    el.innerHTML = `
      <div class="upgrade-icon">${u.icon}</div>
      <div class="upgrade-info">
        <div class="upgrade-name">${u.name}</div>
        <div class="upgrade-desc">${u.desc}</div>
      </div>
    `;
    el.addEventListener('click', () => {
      Audio.sfx('upgrade'); buzz(40);
      Game.activeUpgrades[u.id] = true;
      if (u.id === 'ghost') Game.ghostVisible = true;
      showScreen('gameScreen');
      Game.paused = false;
      Game.lastTime = performance.now();
      Game.updateHUD();
      Game.updateGoalDisplay();
    });
    container.appendChild(el);
  });
  showScreen('upgradeScreen');
}

/* ============================================================
   ВАЛЮТА / ОПЫТ
   ============================================================ */
function addCoins(n) {
  if (!n) return;
  P.coins += n;
  save();
}
function addGems(n) {
  if (!n) return;
  P.gems += n;
  save();
}
function addXP(n) {
  if (!n) return;
  P.xp += n;
  while (P.xp >= P.level * 100) {
    P.xp -= P.level * 100;
    P.level++;
    Audio.sfx('levelup');
  }
  save();
}

/* ============================================================
   ЗАПУСК ИГРЫ
   ============================================================ */
function startGame(mode, opts = {}) {
  Audio.init();
  Audio.resume();
  showScreen('gameScreen');
  setTimeout(() => {
    Game.init('board', 'nextCanvas');
    Game.start(mode, opts);
    if (!P.musicOn) Audio.stopMusic(); else Audio.startMusic();
  }, 50);
}

/* ============================================================
   ОБРАБОТКА КНОПОК МЕНЮ
   ============================================================ */
function setupMenuHandlers() {
  document.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', () => {
      Audio.init(); Audio.resume(); Audio.sfx('click');
      const act = el.dataset.act;
      switch(act) {
        case 'campaign': renderCampaign(); showScreen('campaignScreen'); break;
        case 'roguelike':
          startGame('roguelike', {});
          break;
        case 'daily':
          const day = new Date().getDay();
          const mod = DAILY_MODIFIERS[day];
          const today = new Date().toDateString();
          if (P.dailyDone[today]) {
            showModal('📅 УЖЕ СЕГОДНЯ',
              'Вы уже прошли ежедневное испытание.<br><br><b>' + mod.name + '</b><br>' + mod.desc + '<br><br>Приходите завтра!',
              [{label:'ПОНЯТНО', cls:'primary', fn:hideModal}]);
          } else {
            P.dailyDone[today] = true; save();
            startGame('daily', {});
          }
          break;
        case 'chars': renderChars(); showScreen('charsScreen'); break;
        case 'shop': renderShop(); showScreen('shopScreen'); break;
        case 'toggleMusic':
          P.musicOn = !P.musicOn; save();
          if (P.musicOn) Audio.startMusic(); else Audio.stopMusic();
          break;
        case 'toggleSfx':
          P.sfxOn = !P.sfxOn; save();
          break;
        case 'back':
          if (document.getElementById('charsScreen').classList.contains('active')) showScreen('menuScreen');
          else if (document.getElementById('campaignScreen').classList.contains('active')) showScreen('menuScreen');
          else if (document.getElementById('shopScreen').classList.contains('active')) showScreen('menuScreen');
          break;
        case 'menu':
          showScreen('menuScreen');
          updateMenuBar();
          break;
        case 'pause':
          Game.togglePause();
          break;
      }
    });
  });

  // Tabs
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      Audio.sfx('click');
      shopTab = t.dataset.tab;
      renderShop();
    });
  });

  // Retry
  $('go-retry').addEventListener('click', () => {
    Audio.sfx('click');
    const mode = Game.mode;
    const opts = Game.mode === 'campaign' ? {level: Game.campaignLevel} : {};
    startGame(mode, opts);
  });
}

/* ============================================================
   RESIZE
   ============================================================ */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (document.getElementById('gameScreen').classList.contains('active')) {
      Game.resize();
    }
  }, 100);
});
window.addEventListener('orientationchange', () => {
  setTimeout(() => {
    if (document.getElementById('gameScreen').classList.contains('active')) {
      Game.resize();
    }
  }, 300);
});

/* ============================================================
   INIT
   ============================================================ */
(function init() {
  load();
  updateMenuBar();
  setupMenuHandlers();
  setupControls();

  // First interaction → init audio
  const unlock = () => {
    Audio.init(); Audio.resume();
    if (P.musicOn) Audio.startMusic();
    document.removeEventListener('touchstart', unlock);
    document.removeEventListener('mousedown', unlock);
  };
  document.addEventListener('touchstart', unlock, {passive:true});
  document.addEventListener('mousedown', unlock);

  // Prevent context menu
  document.addEventListener('contextmenu', e => e.preventDefault());

  // Game over screen back button
  updateMenuBar();
})();

</script>
</body>
