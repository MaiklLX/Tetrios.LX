function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function updateMenuBar() {
  const ch = CHARACTERS[P.character];
  $('mb-avatar').textContent = ch.emoji;
  $('mb-name').textContent = ch.name;
  $('mb-lvl').textContent = 'Ур. ' + P.level;
  const xpNeeded = P.level * 100;
  const xpInLevel = P.xp % xpNeeded;
  $('mb-xp').style.width = (xpInLevel/xpNeeded*100) + '%';
  $('mb-coins').textContent = '💰 ' + fmt(P.coins);
  $('mb-gems').textContent = '💎 ' + fmt(P.gems);
  $('ch-gems').textContent = '💎 ' + fmt(P.gems);
  $('cmp-coins').textContent = '💰 ' + fmt(P.coins);
  $('shop-coins').textContent = '💰 ' + fmt(P.coins);
  $('shop-gems').textContent = '💎 ' + fmt(P.gems);
}

/* ============================================================
   ПЕРСОНАЖИ
   ============================================================ */
function renderChars() {
  const grid = $('charsGrid');
  grid.innerHTML = '';
  Object.entries(CHARACTERS).forEach(([id, ch]) => {
    const unlocked = P.unlockedChars.includes(id);
    const selected = P.character === id;
    const card = document.createElement('div');
    card.className = 'char-card' + (selected?' selected':'') + (unlocked?'':' locked');
    card.innerHTML = `
      <div class="char-avatar" style="color:${ch.color};text-shadow:0 0 20px ${ch.color}88">${ch.emoji}</div>
      <div class="char-name">${ch.name}</div>
      <div class="char-desc">${ch.desc}</div>
      <div class="char-cost">${unlocked ? (selected?'✓ ВЫБРАН':'ВЫБРАТЬ') : '💎 ' + ch.cost}</div>
    `;
    card.addEventListener('click', () => {
      Audio.sfx('click');
      if (unlocked) {
        P.character = id; save(); renderChars(); updateMenuBar();
      } else {
        if (P.gems >= ch.cost) {
          P.gems -= ch.cost; P.unlockedChars.push(id); P.character = id;
          Audio.sfx('purchase'); buzz(30); save(); renderChars(); updateMenuBar();
        } else {
          Audio.sfx('error'); buzz(50);
        }
      }
    });
    grid.appendChild(card);
  });
}

/* ============================================================
   КАМПАНИЯ
   ============================================================ */
function renderCampaign() {
  const list = $('campaignList');
  list.innerHTML = '';
  CAMPAIGN_LEVELS.forEach(lvl => {
    const unlocked = lvl.id <= P.campaignProgress;
    const stars = P.campaignStars[lvl.id] || 0;
    const card = document.createElement('div');
    card.className = 'level-card' + (unlocked?'':' locked');
    card.innerHTML = `
      <div class="level-num">${unlocked?lvl.id:'🔒'}</div>
      <div class="level-info">
        <div class="level-name">${lvl.name}</div>
        <div class="level-goal">${lvl.goalType==='score'?'Счёт: '+lvl.goalValue:'Линии: '+lvl.goalValue}</div>
      </div>
      <div class="level-stars">${'⭐'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    `;
    if (unlocked) {
      card.addEventListener('click', () => {
        Audio.sfx('click');
        startGame('campaign', lvl);
      });
    }
    list.appendChild(card);
  });
}

/* ============================================================
   МАГАЗИН
   ============================================================ */
let shopTab = 'boosts';
function renderShop() {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab===shopTab));
  const list = $('shopList');
  list.innerHTML = '';
  if (shopTab === 'boosts') {
    Object.entries(BOOSTS).forEach(([id, b]) => {
      const el = document.createElement('div');
      el.className = 'shop-item';
      el.innerHTML = `
        <div class="shop-icon">${b.icon}</div>
        <div class="shop-info">
          <div class="shop-name">${b.name}</div>
          <div class="shop-desc">${b.desc}</div>
        </div>
        <button class="shop-price">💰 ${b.price}</button>
      `;
      el.querySelector('.shop-price').addEventListener('click', () => {
        if (P.coins >= b.price) {
          P.coins -= b.price;
          P.inventory[id] = (P.inventory[id]||0) + 1;
          Audio.sfx('purchase'); buzz(30); save(); updateMenuBar();
          el.querySelector('.shop-price').textContent = '✓ Куплено';
          el.querySelector('.shop-price').style.background = '#4ecdc4';
          setTimeout(renderShop, 400);
        } else { Audio.sfx('error'); buzz(50); }
      });
      list.appendChild(el);
    });
  } else if (shopTab === 'boxes') {
    Object.entries(BOXES).forEach(([id, box]) => {
      const el = document.createElement('div');
      el.className = 'shop-item';
      el.innerHTML = `
        <div class="shop-icon">${box.icon}</div>
        <div class="shop-info">
          <div class="shop-name">${box.name}</div>
          <div class="shop-desc">Случайный буст</div>
        </div>
        <button class="shop-price">${box.currency==='coins'?'💰':'💎'} ${box.price}</button>
      `;
      el.querySelector('.shop-price').addEventListener('click', () => {
        const cur = box.currency==='coins' ? P.coins : P.gems;
        if (cur >= box.price) {
          if (box.currency==='coins') P.coins -= box.price; else P.gems -= box.price;
          const reward = choice(box.pool);
          P.inventory[reward] = (P.inventory[reward]||0) + 1;
          Audio.sfx('purchase'); buzz([20,40,60]);
          save(); updateMenuBar();
          showModal(`🎉 ${box.icon}`,
            `Вы получили:<br><br><b style="font-size:32px">${BOOSTS[reward].icon}</b><br><b>${BOOSTS[reward].name}</b>`,
            [{label:'ОТЛИЧНО', cls:'primary', fn:()=>{hideModal();renderShop();}}]);
        } else { Audio.sfx('error'); buzz(50); }
      });
      list.appendChild(el);
    });
  } else {
    // Gems
    const offers = [
      { coins: 500, gems: 5 },
      { coins: 1200, gems: 10 },
      { coins: 3000, gems: 20 }
    ];
    offers.forEach(o => {
      const el = document.createElement('div');
      el.className = 'shop-item';
      el.innerHTML = `
        <div class="shop-icon">💎</div>
        <div class="shop-info">
          <div class="shop-name">${o.gems} гемов</div>
          <div class="shop-desc">Обмен на ${o.coins} монет</div>
        </div>
        <button class="shop-price">💰 ${o.coins}</button>
      `;
      el.querySelector('.shop-price').addEventListener('click', () => {
        if (P.coins >= o.coins) {
          P.coins -= o.coins; P.gems += o.gems;
          Audio.sfx('purchase'); buzz(30); save(); updateMenuBar(); renderShop();
        } else { Audio.sfx('error'); buzz(50); }
      });
      list.appendChild(el);
    });
  }
}

