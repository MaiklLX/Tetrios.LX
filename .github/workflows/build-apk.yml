<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a0b2e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tetris Legends</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#12081f;color:#fff;user-select:none;-webkit-user-select:none;
    touch-action:none;overscroll-behavior:none;
  }
  #bg{position:fixed;inset:0;z-index:0;overflow:hidden;
    background:radial-gradient(circle at 20% 10%,#4a1d7a 0%,#12081f 50%,#0a0413 100%)}
  #bg::before{content:'';position:absolute;inset:-50%;
    background:conic-gradient(from 0deg,transparent,#ff6b9d33,#ffb80033,#4ecdc433,transparent);
    animation:spin 40s linear infinite;filter:blur(80px)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.5;
    animation:float 15s ease-in-out infinite}
  .orb.o1{width:200px;height:200px;background:#ff6b9d;top:10%;left:-50px}
  .orb.o2{width:250px;height:250px;background:#ffb800;bottom:20%;right:-80px;animation-delay:-5s}
  .orb.o3{width:180px;height:180px;background:#4ecdc4;top:50%;left:30%;animation-delay:-10s}
  @keyframes float{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-40px) scale(1.2)}}

  #app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}

  .screen{position:absolute;inset:0;display:none;flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
  .screen.active{display:flex;animation:fadeIn .35s ease}
  @keyframes fadeIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}

  /* ============ ОБЩИЕ ============ */
  .title{
    font-size:clamp(32px,10vw,52px);font-weight:900;text-align:center;
    background:linear-gradient(135deg,#ffb800,#ff6b9d,#4ecdc4);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:-1px;line-height:1.05;
    filter:drop-shadow(0 4px 20px rgba(255,107,157,.5));
    margin-bottom:6px;
  }
  .subtitle{text-align:center;font-size:11px;color:#a89bbd;letter-spacing:3px;margin-bottom:20px;text-transform:uppercase}

  .btn{
    -webkit-appearance:none;appearance:none;border:none;cursor:pointer;
    font-family:inherit;font-weight:800;letter-spacing:.5px;color:#fff;
    border-radius:16px;padding:14px 20px;font-size:15px;
    background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 4px 0 rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.3);
    transition:transform .08s,box-shadow .08s,background .15s;
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;position:relative;overflow:hidden;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.3)}
  .btn::after{content:'';position:absolute;inset:0;
    background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.4),transparent 60%);
    opacity:0;transition:opacity .3s;pointer-events:none}
  .btn:active::after{opacity:1}

  .btn.primary{background:linear-gradient(135deg,#ffb800,#ff6b9d);border:none;
    box-shadow:0 4px 0 #8a1e5c,0 8px 24px rgba(255,107,157,.4);font-size:17px;padding:16px}
  .btn.primary:active{box-shadow:0 1px 0 #8a1e5c,0 2px 8px rgba(255,107,157,.4)}
  .btn.green{background:linear-gradient(135deg,#4ecdc4,#44a08d);box-shadow:0 4px 0 #2a6658}
  .btn.blue{background:linear-gradient(135deg,#5b8def,#4a6fd4);box-shadow:0 4px 0 #2c3e80}
  .btn.purple{background:linear-gradient(135deg,#a78bfa,#7c3aed);box-shadow:0 4px 0 #4c1d95}
  .btn.small{padding:8px 12px;font-size:12px;border-radius:10px}
  .btn.icon{width:44px;height:44px;padding:0;border-radius:12px;font-size:18px}

  .panel{
    background:rgba(20,10,40,.6);
    border:1px solid rgba(255,255,255,.1);
    border-radius:20px;padding:16px;
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    box-shadow:0 20px 40px rgba(0,0,0,.4);
  }

  .scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;gap:10px;padding:4px 2px 20px}
  .scroll::-webkit-scrollbar{width:4px}
  .scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px}

  /* ============ МЕНЮ ============ */
  #menuScreen .logo-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px 0}
  #menuScreen .menu-btns{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
  .menu-row{display:flex;gap:10px}
  .menu-row .btn{flex:1}
  .player-bar{
    display:flex;align-items:center;gap:10px;
    background:rgba(20,10,40,.7);border:1px solid rgba(255,255,255,.1);
    border-radius:16px;padding:10px 14px;margin-bottom:14px;
    backdrop-filter:blur(10px);
  }
  .player-avatar{
    width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:24px;background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.05));
    border:2px solid rgba(255,255,255,.25)
  }
  .player-info{flex:1;min-width:0}
  .player-name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .player-lvl{font-size:11px;color:#a89bbd}
  .xp-bar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:3px;overflow:hidden}
  .xp-fill{height:100%;background:linear-gradient(90deg,#4ecdc4,#5b8def);border-radius:2px;transition:width .4s}
  .currency{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:700;white-space:nowrap}
  .currency span{background:rgba(255,255,255,.1);padding:4px 8px;border-radius:8px}

  /* ============ ИГРОВОЙ ЭКРАН ============ */
  #gameScreen{padding-top:max(6px,env(safe-area-inset-top));gap:6px}
  .game-hud{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px}
  .hud-box{background:rgba(20,10,40,.7);border:1px solid rgba(255,255,255,.1);
    border-radius:10px;padding:4px 6px;text-align:center;min-width:0;overflow:hidden}
  .hud-box span{display:block;font-size:8px;color:#a89bbd;letter-spacing:.5px;white-space:nowrap}
  .hud-box b{display:block;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
  .game-sub{display:flex;gap:6px;align-items:center}
  .next-box{background:rgba(20,10,40,.7);border:1px solid rgba(255,255,255,.1);
    border-radius:10px;padding:3px 6px;display:flex;align-items:center;gap:6px}
  .next-box small{font-size:8px;color:#a89bbd;letter-spacing:.5px}
  .game-sub .spacer{flex:1}
  #boardArea{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
  #board{display:block;border-radius:14px;
    box-shadow:0 0 0 2px rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.7),inset 0 0 60px rgba(255,107,157,.06);
    background:#0a0413}
  #fxLayer{position:absolute;inset:0;pointer-events:none;z-index:5}

  .bottom-controls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:0 0 auto}
  .bottom-controls .btn{min-height:52px;font-size:20px;padding:0;border-radius:14px}

  .gesture-hint{
    position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
    font-size:10px;color:rgba(255,255,255,.4);white-space:nowrap;pointer-events:none
  }

  /* ============ МОДАЛЬНЫЕ ============ */
  .overlay{position:absolute;inset:0;background:rgba(10,4,20,.85);
    display:none;align-items:center;justify-content:center;z-index:20;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:20px}
  .overlay.show{display:flex;animation:fadeIn .3s ease}
  .overlay-card{background:linear-gradient(135deg,rgba(60,20,100,.95),rgba(30,10,50,.95));
    border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:24px 20px;
    max-width:400px;width:100%;text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,.6)}

  /* ============ ПЕРСОНАЖИ ============ */
  .chars-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .char-card{
    background:rgba(20,10,40,.7);border:2px solid rgba(255,255,255,.1);
    border-radius:16px;padding:12px;cursor:pointer;transition:all .2s;
    display:flex;flex-direction:column;align-items:center;gap:6px;position:relative
  }
  .char-card:active{transform:scale(.96)}
  .char-card.selected{border-color:#ffb800;background:rgba(255,184,0,.15);
    box-shadow:0 0 24px rgba(255,184,0,.4)}
  .char-card.locked{opacity:.5}
  .char-avatar{font-size:40px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
  .char-name{font-weight:800;font-size:13px}
  .char-desc{font-size:10px;color:#a89bbd;text-align:center;line-height:1.2;min-height:24px}
  .char-cost{font-size:11px;font-weight:800;color:#4ecdc4}

  /* ============ КАМПАНИЯ ============ */
  .level-card{
    background:rgba(20,10,40,.7);border:1px solid rgba(255,255,255,.1);
    border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;
    cursor:pointer;transition:all .15s
  }
  .level-card:active{transform:scale(.98)}
  .level-card.locked{opacity:.4}
  .level-num{
    width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:20px;background:linear-gradient(135deg,#5b8def,#4a6fd4);
    box-shadow:0 4px 12px rgba(91,141,239,.4);flex-shrink:0
  }
  .level-card.locked .level-num{background:rgba(255,255,255,.1);box-shadow:none}
  .level-info{flex:1;min-width:0}
  .level-name{font-weight:800;font-size:14px}
  .level-goal{font-size:11px;color:#a89bbd;margin-top:2px}
  .level-stars{font-size:12px;letter-spacing:1px;flex-shrink:0}

  /* ============ МАГАЗИН ============ */
  .tabs{display:flex;gap:6px;background:rgba(20,10,40,.7);padding:5px;border-radius:14px;margin-bottom:12px}
  .tab{flex:1;padding:10px;border:none;background:transparent;color:#a89bbd;font-family:inherit;
    font-weight:700;font-size:12px;border-radius:10px;cursor:pointer;transition:all .2s}
  .tab.active{background:linear-gradient(135deg,#ffb800,#ff6b9d);color:#fff;
    box-shadow:0 4px 12px rgba(255,107,157,.4)}
  .shop-item{
    background:rgba(20,10,40,.7);border:1px solid rgba(255,255,255,.1);
    border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px
  }
  .shop-icon{width:52px;height:52px;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:28px;
    background:rgba(255,255,255,.08);flex-shrink:0}
  .shop-info{flex:1;min-width:0}
  .shop-name{font-weight:800;font-size:13px}
  .shop-desc{font-size:10px;color:#a89bbd;margin-top:2px;line-height:1.3}
  .shop-price{font-weight:800;font-size:12px;padding:6px 10px;border-radius:8px;
    background:linear-gradient(135deg,#ffb800,#ff6b9d);border:none;color:#fff;
    cursor:pointer;font-family:inherit;white-space:nowrap}
  .shop-price:active{opacity:.8}

  /* ============ БУСТЫ (в игре) ============ */
  .boost-row{display:flex;gap:5px;flex-wrap:wrap}
  .boost-btn{
    width:38px;height:38px;border-radius:10px;
    background:rgba(20,10,40,.7);border:1px solid rgba(255,255,255,.15);
    display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;
    position:relative;transition:all .15s
  }
  .boost-btn:active{transform:scale(.9);background:rgba(255,255,255,.2)}
  .boost-btn .cnt{position:absolute;bottom:-3px;right:-3px;background:#ffb800;color:#000;
    font-size:9px;font-weight:900;border-radius:6px;padding:1px 4px;min-width:14px;text-align:center}
  .boost-btn.empty{opacity:.3}

  /* ============ АПГРЕЙДЫ РОГАЛИК ============ */
  .upgrade-pick{display:flex;flex-direction:column;gap:10px;width:100%;max-width:400px}
  .upgrade-option{
    background:linear-gradient(135deg,rgba(60,20,100,.9),rgba(30,10,50,.9));
    border:1px solid rgba(255,255,255,.15);border-radius:16px;padding:14px;
    display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s
  }
  .upgrade-option:active{transform:scale(.97);border-color:#ffb800}
  .upgrade-icon{font-size:32px;flex-shrink:0}
  .upgrade-info{flex:1;text-align:left}
  .upgrade-name{font-weight:800;font-size:14px}
  .upgrade-desc{font-size:11px;color:#a89bbd;margin-top:2px}
  .rarity-common{border-left:4px solid #8a8aa8}
  .rarity-rare{border-left:4px solid #5b8def}
  .rarity-epic{border-left:4px solid #a78bfa}
  .rarity-legend{border-left:4px solid #ffb800}

  /* ============ GAME OVER ============ */
  .stat-row{display:flex;justify-content:space-between;padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,.1);font-size:14px}
  .stat-row:last-child{border:none}
  .stat-row .lbl{color:#a89bbd}
  .stat-row .val{font-weight:800}

  .particle{position:absolute;pointer-events:none;font-weight:900;font-size:22px;
    animation:particleUp 1s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.8)}
  @keyframes particleUp{to{transform:translateY(-80px);opacity:0}}

  .coin-pop{position:absolute;pointer-events:none;font-size:20px;
    animation:coinFly 1.2s ease-out forwards}
  @keyframes coinFly{
    0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(0,-60px) scale(.5);opacity:0}
  }
</style>
</head>
<body>
<div id="bg">
  <div class="orb o1"></div>
  <div class="orb o2"></div>
  <div class="orb o3"></div>
</div>

<!-- ============== ГЛАВНОЕ МЕНЮ ============== -->
<div class="screen active" id="menuScreen">
  <div class="player-bar">
    <div class="player-avatar" id="mb-avatar">❄️</div>
    <div class="player-info">
      <div class="player-name" id="mb-name">Льдинка</div>
      <div class="player-lvl" id="mb-lvl">Ур. 1</div>
      <div class="xp-bar"><div class="xp-fill" id="mb-xp" style="width:0%"></div></div>
    </div>
    <div class="currency">
      <span id="mb-coins">💰 0</span>
      <span id="mb-gems">💎 0</span>
    </div>
  </div>

  <div class="logo-wrap">
    <div class="title">TETRIS<br>LEGENDS</div>
    <div class="subtitle">БЛОКИ · МАГИЯ · ЛЕГЕНДЫ</div>
  </div>

  <div class="menu-btns">
    <button class="btn primary" data-act="campaign">🗺️ КАМПАНИЯ</button>
    <div class="menu-row">
      <button class="btn purple" data-act="roguelike">🎲 РОГАЛИК</button>
      <button class="btn green" data-act="daily">📅 ДЕНЬ</button>
    </div>
    <div class="menu-row">
      <button class="btn blue" data-act="chars">🎭 ГЕРОИ</button>
      <button class="btn" data-act="shop">🛒 МАГАЗИН</button>
    </div>
    <div class="menu-row">
      <button class="btn small" data-act="toggleMusic">🎵 Музыка</button>
      <button class="btn small" data-act="toggleSfx">🔊 Звук</button>
    </div>
  </div>
</div>

<!-- ============== ВЫБОР ПЕРСОНАЖА ============== -->
<div class="screen" id="charsScreen">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <button class="btn icon" data-act="back">←</button>
    <div class="title" style="font-size:24px;margin:0;flex:1;text-align:left">ГЕРОИ</div>
    <div class="currency"><span id="ch-gems">💎 0</span></div>
  </div>
  <div class="scroll">
    <div class="chars-grid" id="charsGrid"></div>
  </div>
</div>

<!-- ============== КАМПАНИЯ ============== -->
<div class="screen" id="campaignScreen">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <button class="btn icon" data-act="back">←</button>
    <div class="title" style="font-size:24px;margin:0;flex:1;text-align:left">КАМПАНИЯ</div>
    <div class="currency"><span id="cmp-coins">💰 0</span></div>
  </div>
  <div class="scroll" id="campaignList"></div>
</div>

<!-- ============== МАГАЗИН ============== -->
<div class="screen" id="shopScreen">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
    <button class="btn icon" data-act="back">←</button>
    <div class="title" style="font-size:24px;margin:0;flex:1;text-align:left">МАГАЗИН</div>
    <div class="currency">
      <span id="shop-coins">💰 0</span>
      <span id="shop-gems">💎 0</span>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" data-tab="boosts">БУСТЫ</button>
    <button class="tab" data-tab="boxes">БОКСЫ</button>
    <button class="tab" data-tab="gems">ВАЛЮТА</button>
  </div>
  <div class="scroll" id="shopList"></div>
</div>

<!-- ============== ИГРОВОЙ ЭКРАН ============== -->
<div class="screen" id="gameScreen">
  <div class="game-hud">
    <div class="hud-box"><span>ОЧКИ</span><b id="g-score">0</b></div>
    <div class="hud-box"><span>УРОВЕНЬ</span><b id="g-level">1</b></div>
    <div class="hud-box"><span>ЛИНИИ</span><b id="g-lines">0</b></div>
    <div class="hud-box"><span>ЦЕЛЬ</span><b id="g-goal">—</b></div>
  </div>
  <div class="game-sub">
    <div class="next-box"><small>ДАЛЕЕ</small><canvas id="nextCanvas" width="80" height="80" style="width:38px;height:38px"></canvas></div>
    <div class="boost-row" id="boostRow"></div>
    <div class="spacer"></div>
    <button class="btn icon" data-act="pause" style="width:36px;height:36px;font-size:14px">⏸</button>
  </div>
  <div id="boardArea">
    <canvas id="board"></canvas>
    <div id="fxLayer"></div>
    <div class="gesture-hint">Свайп ← → | Тап — поворот | Быстрый свайп ↓ — сброс</div>
  </div>
  <div class="bottom-controls">
    <button class="btn" id="btnLeft">◀</button>
    <button class="btn" id="btnRotate">↻</button>
    <button class="btn" id="btnRight">▶</button>
    <button class="btn" id="btnDown">▼</button>
    <button class="btn" id="btnDrop">⇓</button>
  </div>
</div>

<!-- ============== ЭКРАН АПГРЕЙДОВ ============== -->
<div class="screen" id="upgradeScreen" style="background:rgba(10,4,20,.95);z-index:15">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px">
    <div class="title" style="font-size:28px;margin-bottom:4px">УРОВЕНЬ ПОВЫШЕН!</div>
    <div class="subtitle" style="margin-bottom:20px">ВЫБЕРИ УЛУЧШЕНИЕ</div>
    <div class="upgrade-pick" id="upgradePick"></div>
  </div>
</div>

<!-- ============== GAME OVER ============== -->
<div class="screen" id="gameOverScreen">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px">
    <div class="panel" style="width:100%;max-width:400px;text-align:center">
      <div style="font-size:48px;margin-bottom:10px" id="go-icon">💀</div>
      <div class="title" style="font-size:28px;margin-bottom:6px" id="go-title">ИГРА ОКОНЧЕНА</div>
      <div style="color:#a89bbd;font-size:12px;margin-bottom:20px" id="go-sub">Счёт: 0</div>
      <div style="text-align:left;margin-bottom:20px">
        <div class="stat-row"><span class="lbl">Очки</span><span class="val" id="go-score">0</span></div>
        <div class="stat-row"><span class="lbl">Линии</span><span class="val" id="go-lines">0</span></div>
        <div class="stat-row"><span class="lbl">Монеты</span><span class="val" id="go-coins">+0</span></div>
        <div class="stat-row"><span class="lbl">Опыт</span><span class="val" id="go-xp">+0</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <button class="btn primary" id="go-retry">ПОВТОРИТЬ</button>
        <button class="btn" data-act="menu">В МЕНЮ</button>
      </div>
    </div>
  </div>
</div>

