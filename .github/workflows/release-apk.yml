
name: Build Block Buddies Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Bundle CC0 soundtrack for offline play
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/site/audio"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://opengameart.org/sites/default/files/01_holiznacc0_-_chills_0.mp3" \
            --output "$GITHUB_WORKSPACE/site/audio/chills.mp3"
          test -s "$GITHUB_WORKSPACE/site/audio/chills.mp3"
          AUDIO_SIZE="$(stat -c%s "$GITHUB_WORKSPACE/site/audio/chills.mp3")"
          if [ "$AUDIO_SIZE" -lt 1000000 ]; then
            echo "::error::CC0 soundtrack download is unexpectedly small"
            exit 1
          fi
          echo "Prepared bundled CC0 soundtrack ($AUDIO_SIZE bytes)"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/android-project"

          unzip -oq \
            "$GITHUB_WORKSPACE/Block_Buddies_Android_APK_Project_v1.zip" \
            -d "$GITHUB_WORKSPACE/android-project"

          PROJECT_DIR="$(find "$GITHUB_WORKSPACE/android-project" \
            -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Gradle settings file not found"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::Expected app/build.gradle not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Prepare local Three.js runtime
        shell: bash
        run: |
          set -euo pipefail
          npm pack three@0.180.0 --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/three-package" "$GITHUB_WORKSPACE/site/vendor"
          tar -xzf "$RUNNER_TEMP/three-0.180.0.tgz" -C "$RUNNER_TEMP/three-package"
          rm -rf "$GITHUB_WORKSPACE/site/vendor/three"
          cp -a "$RUNNER_TEMP/three-package/package" "$GITHUB_WORKSPACE/site/vendor/three"
          test -s "$GITHUB_WORKSPACE/site/vendor/three/build/three.module.js"
          test -s "$GITHUB_WORKSPACE/site/vendor/three/examples/jsm/loaders/GLTFLoader.js"
          echo "Prepared pinned local Three.js 0.180.0 runtime"
          node "$GITHUB_WORKSPACE/site/validate-3d-runtime.mjs"

      - name: Sync latest game and fix Android activity
        shell: bash
        run: |
          set -euo pipefail

          ASSET_INDEX="$(find "$PROJECT_DIR/app/src/main" \
            -type f -path '*/assets/*' -name index.html -print -quit)"

          if [ -z "$ASSET_INDEX" ]; then
            echo "::error::Android assets/index.html not found"
            exit 1
          fi

          cp "$GITHUB_WORKSPACE/site/index.html" "$ASSET_INDEX"
          ASSET_DIR="$(dirname "$ASSET_INDEX")"

          # Keep every local dependency referenced by index.html beside it in
          # Android assets. Copying index.html alone silently disables the 3D
          # modules and the visual theme inside the WebView APK.
          for asset in favicon.svg visual-overhaul.css visual-3d.js arena-3d.js; do
            SOURCE="$GITHUB_WORKSPACE/site/$asset"
            if [ ! -s "$SOURCE" ]; then
              echo "::error::Required web asset is missing: $SOURCE"
              exit 1
            fi
            cp "$SOURCE" "$ASSET_DIR/$asset"
          done

          if [ ! -d "$GITHUB_WORKSPACE/site/characters" ]; then
            echo "::error::Character asset directory is missing"
            exit 1
          fi
          mkdir -p "$ASSET_DIR/characters"
          cp -a "$GITHUB_WORKSPACE/site/characters/." "$ASSET_DIR/characters/"

          if [ ! -s "$GITHUB_WORKSPACE/site/audio/chills.mp3" ]; then
            echo "::error::Bundled soundtrack is missing"
            exit 1
          fi
          mkdir -p "$ASSET_DIR/audio"
          cp "$GITHUB_WORKSPACE/site/audio/chills.mp3" "$ASSET_DIR/audio/chills.mp3"
          test -s "$ASSET_DIR/audio/chills.mp3"
          echo "Synced offline soundtrack into Android assets: $ASSET_DIR/audio/chills.mp3"

          for asset in index.html favicon.svg visual-overhaul.css visual-3d.js arena-3d.js; do
            if [ ! -s "$ASSET_DIR/$asset" ]; then
              echo "::error::Android WebView asset was not synced: $asset"
              exit 1
            fi
          done
          if [ ! -d "$GITHUB_WORKSPACE/site/vendor/three" ]; then
            echo "::error::Local Three.js runtime was not prepared"
            exit 1
          fi
          mkdir -p "$ASSET_DIR/vendor"
          rm -rf "$ASSET_DIR/vendor/three"
          cp -a "$GITHUB_WORKSPACE/site/vendor/three" "$ASSET_DIR/vendor/three"
          test -s "$ASSET_DIR/vendor/three/build/three.module.js"
          test -s "$ASSET_DIR/vendor/three/examples/jsm/loaders/GLTFLoader.js"
          echo "Synced local Three.js runtime into Android assets: $ASSET_DIR/vendor/three"

          echo "Synced game and 3D dependencies into Android assets: $ASSET_DIR"

          MAIN_ACTIVITY="$(find "$PROJECT_DIR/app/src/main/java" \
            -type f -name MainActivity.java -print -quit)"

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "::error::MainActivity.java not found"
            exit 1
          fi

          python3 "$GITHUB_WORKSPACE/scripts/patch-android-webview.py" "$PROJECT_DIR"
          grep -q 'WebViewAssetLoader' "$MAIN_ACTIVITY"
          grep -q 'appassets.androidplatform.net/assets/index.html' "$MAIN_ACTIVITY"
          echo "Hardened Android WebView with local HTTPS asset origin"

      - name: Download and decrypt signing key
        shell: bash
        env:
          SIGNING_REPO_READ_TOKEN: ${{ secrets.SIGNING_REPO_READ_TOKEN }}
          ENCRYPTION_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_ENCRYPTION_PASSWORD }}
        run: |
          set -euo pipefail

          echo "Checking access to the signing repository..."

          REPO_STATUS=$(curl --silent --show-error \
            -o "$RUNNER_TEMP/repo-check.json" \
            -w "%{http_code}" \
            -H "Authorization: Bearer $SIGNING_REPO_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/MaiklLX/Tetrios-Signing")

          echo "Signing repository API status: $REPO_STATUS"

          if [ "$REPO_STATUS" != "200" ]; then
            echo "Repository API message:"
            jq -r '.message // "No message"' \
              "$RUNNER_TEMP/repo-check.json"
            exit 1
          fi

          if [ -z "$SIGNING_REPO_READ_TOKEN" ] || \
             [ -z "$ENCRYPTION_PASSWORD" ]; then
            echo "::error::Signing download or encryption secret is missing"
            exit 1
          fi


          API_URL="https://api.github.com/repos/MaiklLX/Tetrios-Signing/contents/signing/release.keystore.enc?ref=main"

          HTTP_CODE=$(curl --silent --show-error \
            -o "$RUNNER_TEMP/signing-response.json" \
            -w "%{http_code}" \
            -H "Authorization: Bearer $SIGNING_REPO_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL")

          echo "GitHub API HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "GitHub API error response:"
            jq -r '.message // "No error message returned"' \
              "$RUNNER_TEMP/signing-response.json"
            exit 1
          fi

          jq -er '.content' "$RUNNER_TEMP/signing-response.json" \
            | tr -d '\n' \
            | base64 --decode \
            > "$RUNNER_TEMP/release.keystore.enc"

          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in "$RUNNER_TEMP/release.keystore.enc" \
            -out "$RUNNER_TEMP/release.keystore" \
            -pass env:ENCRYPTION_PASSWORD

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" \
            >> "$GITHUB_ENV"

      - name: Configure release signing
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"

          python3 - "$APP_GRADLE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          if "signingConfigs" in s or "buildTypes" in s:
              raise SystemExit(
                  "Unexpected existing signing/buildTypes configuration. "
                  "Stopped to avoid overwriting existing settings."
              )

          if "android {" not in s or "defaultConfig {" not in s:
              raise SystemExit("Unexpected app/build.gradle structure.")

          signing = '''
              signingConfigs {
                  release {
                      storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias "blockbuddies"
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          '''

          s = s.replace("android {", "android {" + signing, 1)
          p.write_text(s)
          PY

      - name: Install Android SDK components
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null || true

          "$SDKMANAGER" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build signed release APK
        shell: bash
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if ! command -v gradle >/dev/null 2>&1; then
            echo "::error::Gradle is not installed"
            exit 1
          fi

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload signed release APK
        uses: actions/upload-artifact@v6
        with:
          name: Block-Buddies-release-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
