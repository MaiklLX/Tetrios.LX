name: Godot Native Project Check

on:
  push:
    branches:
      - godot/android-native-foundation-2026-11-05
    paths:
      - "godot/**"
      - ".github/workflows/godot-native-check.yml"
  pull_request:
    paths:
      - "godot/**"
      - ".github/workflows/godot-native-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Import project
        run: godot --headless --editor --path godot --quit
      - name: Run model tests
        run: godot --headless --path godot --script res://tests/game_model_test.gd
      - name: Run scene smoke test
        run: godot --headless --path godot --quit-after 3
