name: Deploy Block Buddies Web

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare local Three.js runtime
        shell: bash
        run: |
          set -euo pipefail
          npm pack three@0.180.0 --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/three-package" "$GITHUB_WORKSPACE/site/vendor"
          tar -xzf "$RUNNER_TEMP/three-0.180.0.tgz" -C "$RUNNER_TEMP/three-package"
          rm -rf "$GITHUB_WORKSPACE/site/vendor/three"
          cp -a "$RUNNER_TEMP/three-package/package" "$GITHUB_WORKSPACE/site/vendor/three"
          test -s "$GITHUB_WORKSPACE/site/vendor/three/build/three.module.js"
          test -s "$GITHUB_WORKSPACE/site/vendor/three/examples/jsm/loaders/GLTFLoader.js"
          echo "Prepared pinned local Three.js 0.180.0 runtime"
          node "$GITHUB_WORKSPACE/site/validate-3d-runtime.mjs"

      - name: Upload web game
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
