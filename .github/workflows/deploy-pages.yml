name: Deploy Block Buddies Web

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bundle CC0 soundtrack for offline play
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/site/audio"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://opengameart.org/sites/default/files/01_holiznacc0_-_chills_0.mp3" \
            --output "$GITHUB_WORKSPACE/site/audio/chills.mp3"
          test -s "$GITHUB_WORKSPACE/site/audio/chills.mp3"
          AUDIO_SIZE="$(stat -c%s "$GITHUB_WORKSPACE/site/audio/chills.mp3")"
          if [ "$AUDIO_SIZE" -lt 1000000 ]; then
            echo "::error::CC0 soundtrack download is unexpectedly small"
            exit 1
          fi
          echo "Prepared bundled CC0 soundtrack ($AUDIO_SIZE bytes)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare local Three.js runtime
        shell: bash
        run: |
          set -euo pipefail
          npm pack three@0.180.0 --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/three-package" "$GITHUB_WORKSPACE/site/vendor"
          tar -xzf "$RUNNER_TEMP/three-0.180.0.tgz" -C "$RUNNER_TEMP/three-package"
          rm -rf "$GITHUB_WORKSPACE/site/vendor/three"
          cp -a "$RUNNER_TEMP/three-package/package" "$GITHUB_WORKSPACE/site/vendor/three"
          test -s "$GITHUB_WORKSPACE/site/vendor/three/build/three.module.js"
          test -s "$GITHUB_WORKSPACE/site/vendor/three/examples/jsm/loaders/GLTFLoader.js"
          echo "Prepared pinned local Three.js 0.180.0 runtime"
          node "$GITHUB_WORKSPACE/site/validate-3d-runtime.mjs"

      - name: Setup Godot with Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Import Godot project and run regression suite
        run: |
          set -euo pipefail
          godot --headless --editor --path godot --quit
          godot --headless --path godot --check-only --script res://scripts/main.gd
          for test in \
            game_model_test.gd web_save_migration_test.gd campaign_progress_test.gd \
            campaign_collection_test.gd campaign_collection_layout_test.gd campaign_achievements_test.gd \
            campaign_planet_catalog_test.gd campaign_mechanics_test.gd campaign_boss_session_test.gd \
            campaign_effect_session_test.gd campaign_special_piece_test.gd campaign_piece_runtime_test.gd \
            campaign_live_integration_test.gd campaign_piece_store_test.gd block_run_model_test.gd \
            block_run_effects_test.gd block_run_board_test.gd block_run_session_test.gd \
            block_run_bridge_test.gd block_run_live_integration_test.gd; do
            echo "Running $test"
            godot --headless --path godot --script "res://tests/$test"
          done
          godot --headless --path godot --quit-after 3

      - name: Export Godot Web build into isolated preview folder
        run: |
          set -euo pipefail
          mkdir -p build/godot-web site/godot-preview
          godot --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/build/godot-web/index.html"
          test -s build/godot-web/index.html
          compgen -G "build/godot-web/*.wasm" >/dev/null || compgen -G "build/godot-web/*.wasm.br" >/dev/null
          compgen -G "build/godot-web/*.pck" >/dev/null || compgen -G "build/godot-web/*.pck.br" >/dev/null
          cp -a build/godot-web/. site/godot-preview/
          test -s site/godot-preview/index.html

      - name: Install Chromium smoke-test dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Verify Godot preview in real Chromium
        timeout-minutes: 5
        run: node scripts/validate-godot-web.mjs

      - name: Upload web game
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Large offline-first assets can keep Pages in syncing_files longer than the default 10 minutes.
          timeout: 1200000
