name: Cross-platform Visual Preview

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to preview (defaults to the current ref)"
        required: false
        type: string
  push:
    branches:
      - 'feature/gameplay-evolution-*'
      - 'feature/visual-redesign-*'
    paths:
      - 'site/**'
      - 'scripts/cross-platform-visual-preview.cjs'
      - '.github/workflows/cross-platform-visual-preview.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/cross-platform-visual-preview.cjs'
      - '.github/workflows/cross-platform-visual-preview.yml'

permissions:
  contents: read

concurrency:
  group: cross-platform-visual-preview-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  visual-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source without deploying
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.ref || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare local game dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/audio site/vendor
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://opengameart.org/sites/default/files/01_holiznacc0_-_chills_0.mp3" \
            --output site/audio/chills.mp3
          test -s site/audio/chills.mp3
          test "$(stat -c%s site/audio/chills.mp3)" -ge 1000000
          # Three.js remains required by the campaign universe atlas; only the arena renderer is 2D-only.
          npm pack three@0.180.0 --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/three-package"
          tar -xzf "$RUNNER_TEMP/three-0.180.0.tgz" -C "$RUNNER_TEMP/three-package"
          cp -a "$RUNNER_TEMP/three-package/package" site/vendor/three
          node site/validate-3d-runtime.mjs
          node site/validate-gameplay-modes.mjs

      - name: Install Playwright Chromium and WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium webkit

      - name: Start local preview server
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory site > "$RUNNER_TEMP/cross-platform-preview-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/cross-platform-preview-server.pid"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/cross-platform-preview-server.log"
          exit 1

      - name: Capture desktop Chromium and iOS WebKit previews
        run: node scripts/cross-platform-visual-preview.cjs

      - name: Upload cross-platform screenshots and geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tetrios-cross-platform-visual-preview
          path: cross-platform-preview-artifacts/
          if-no-files-found: warn
          retention-days: 14
