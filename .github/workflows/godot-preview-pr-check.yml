name: Godot Preview Pull Request Check

on:
  pull_request:
    branches:
      - main
    paths:
      - "godot/**"
      - "scripts/validate-godot-web.mjs"
      - ".github/workflows/godot-preview-pr-check.yml"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.4.1 with Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Import project and run regression suite
        run: |
          set -euo pipefail
          godot --headless --editor --path godot --quit
          godot --headless --path godot --check-only --script res://scripts/main.gd
          for test in \
            game_model_test.gd web_save_migration_test.gd campaign_progress_test.gd \
            campaign_collection_test.gd campaign_collection_layout_test.gd campaign_achievements_test.gd \
            campaign_planet_catalog_test.gd campaign_mechanics_test.gd campaign_boss_session_test.gd \
            campaign_effect_session_test.gd campaign_special_piece_test.gd campaign_piece_runtime_test.gd \
            campaign_live_integration_test.gd campaign_piece_store_test.gd gesture_input_test.gd block_run_model_test.gd \
            block_run_effects_test.gd block_run_board_test.gd block_run_session_test.gd \
            block_run_bridge_test.gd block_run_live_integration_test.gd; do
            echo "Running $test"
            godot --headless --path godot --script "res://tests/$test"
          done
          godot --headless --path godot --quit-after 3

      - name: Export Web build
        run: |
          set -euo pipefail
          mkdir -p build/godot-web
          godot --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/build/godot-web/index.html"
          test -s build/godot-web/index.html
          compgen -G "build/godot-web/*.wasm" >/dev/null || compgen -G "build/godot-web/*.wasm.br" >/dev/null
          compgen -G "build/godot-web/*.pck" >/dev/null || compgen -G "build/godot-web/*.pck.br" >/dev/null

      - name: Install Chromium smoke-test dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Run real-browser Web smoke tests
        timeout-minutes: 5
        run: node scripts/validate-godot-web.mjs
