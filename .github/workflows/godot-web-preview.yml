name: Godot Web Preview Build

on:
  push:
    branches:
      - godot/kt548-web-preview-prep-2026-11-09
    paths:
      - "godot/**"
      - "scripts/validate-godot-web.mjs"
      - ".github/workflows/godot-web-preview.yml"
  pull_request:
    paths:
      - "godot/**"
      - "scripts/validate-godot-web.mjs"
      - ".github/workflows/godot-web-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot with Web export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Import project
        run: godot --headless --editor --path godot --quit

      - name: Parse main scene script
        run: godot --headless --path godot --check-only --script res://scripts/main.gd

      - name: Run model tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/game_model_test.gd

      - name: Run Web save migration tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/web_save_migration_test.gd

      - name: Run campaign progression tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/campaign_progress_test.gd

      - name: Run campaign collection tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/campaign_collection_test.gd

      - name: Run campaign collection layout tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/campaign_collection_layout_test.gd

      - name: Run campaign achievement tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/campaign_achievements_test.gd

      - name: Run campaign authored catalog tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/campaign_planet_catalog_test.gd

      - name: Run Campaign mechanics registry tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/campaign_mechanics_test.gd

      - name: Run campaign boss session tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/campaign_boss_session_test.gd

      - name: Run isolated campaign effect session tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/campaign_effect_session_test.gd

      - name: Run campaign special piece prototype tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/campaign_special_piece_test.gd

      - name: Run isolated campaign piece runtime tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/campaign_piece_runtime_test.gd

      - name: Run campaign live integration tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/campaign_live_integration_test.gd

      - name: Run campaign run checkpoint store tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/campaign_piece_store_test.gd

      - name: Run Block Run model tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/block_run_model_test.gd

      - name: Run Block Run event effect tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/block_run_effects_test.gd

      - name: Run Block Run board mutation tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/block_run_board_test.gd

      - name: Run Block Run session integration tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/block_run_session_test.gd

      - name: Run Block Run live-board bridge tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/block_run_bridge_test.gd

      - name: Run Block Run live gameplay integration tests
        timeout-minutes: 2
        run: godot --headless --path godot --script res://tests/block_run_live_integration_test.gd

      - name: Run scene smoke test
        run: godot --headless --path godot --quit-after 3

      - name: Export Web preview
        run: |
          set -euo pipefail
          mkdir -p build/godot-web
          godot --headless --path godot --export-release "Web" "$GITHUB_WORKSPACE/build/godot-web/index.html"
          test -s build/godot-web/index.html
          find build/godot-web -maxdepth 1 -type f -printf '%f %s bytes\\n' | sort
          if ! compgen -G "build/godot-web/*.wasm" >/dev/null && ! compgen -G "build/godot-web/*.wasm.br" >/dev/null; then
            echo "::error::Web export is missing its WebAssembly runtime"
            exit 1
          fi
          if ! compgen -G "build/godot-web/*.pck" >/dev/null && ! compgen -G "build/godot-web/*.pck.br" >/dev/null; then
            echo "::error::Web export is missing its game data package"
            exit 1
          fi

      - name: Install browser smoke-test dependencies
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Run real-browser Web smoke tests
        timeout-minutes: 5
        run: node scripts/validate-godot-web.mjs

      - name: Upload isolated Web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: block-buddies-godot-web-preview
          path: build/godot-web/
          if-no-files-found: error
          retention-days: 14

  deploy-preview:
    name: Publish isolated Godot browser preview
    needs: export-web
    if: github.event_name == 'push' && github.ref == 'refs/heads/godot/kt548-web-preview-prep-2026-11-09'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}godot-preview/
    steps:
      - name: Checkout preserved public site from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: legacy-source
          persist-credentials: false

      - name: Download validated Godot Web artifact
        uses: actions/download-artifact@v4
        with:
          name: block-buddies-godot-web-preview
          path: build/godot-web

      - name: Assemble unchanged legacy site plus isolated Godot preview
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_DIR="$RUNNER_TEMP/pages-site"
          mkdir -p "$PUBLISH_DIR"
          cp -a legacy-source/site/. "$PUBLISH_DIR/"

          mkdir -p "$PUBLISH_DIR/audio"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://opengameart.org/sites/default/files/01_holiznacc0_-_chills_0.mp3" \
            --output "$PUBLISH_DIR/audio/chills.mp3"
          test -s "$PUBLISH_DIR/audio/chills.mp3"
          AUDIO_SIZE="$(stat -c%s "$PUBLISH_DIR/audio/chills.mp3")"
          if [ "$AUDIO_SIZE" -lt 1000000 ]; then
            echo "::error::CC0 soundtrack download is unexpectedly small"
            exit 1
          fi

          npm pack three@0.180.0 --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/three-package" "$PUBLISH_DIR/vendor"
          tar -xzf "$RUNNER_TEMP/three-0.180.0.tgz" -C "$RUNNER_TEMP/three-package"
          rm -rf "$PUBLISH_DIR/vendor/three"
          cp -a "$RUNNER_TEMP/three-package/package" "$PUBLISH_DIR/vendor/three"
          test -s "$PUBLISH_DIR/vendor/three/build/three.module.js"
          test -s "$PUBLISH_DIR/vendor/three/examples/jsm/loaders/GLTFLoader.js"
          node "$PUBLISH_DIR/validate-3d-runtime.mjs"

          mkdir -p "$PUBLISH_DIR/godot-preview"
          cp -a build/godot-web/. "$PUBLISH_DIR/godot-preview/"
          test -s "$PUBLISH_DIR/godot-preview/index.html"
          test -s "$PUBLISH_DIR/godot-preview/index.wasm"
          test -s "$PUBLISH_DIR/godot-preview/index.pck"
          touch "$PUBLISH_DIR/.nojekyll"
          echo "Legacy site preserved; Godot preview isolated at /godot-preview/"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-site

      - name: Deploy preserved site and isolated Godot preview
        id: deployment
        uses: actions/deploy-pages@v4
